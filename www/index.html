<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#4A90D9">
<title>Transit Go · 出行导航</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
/* ========== Reset & Base ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#4A90D9;--primary-dark:#3A7BC8;--danger:#E74C3C;
  --bg:#FFFFFF;--bg2:#F5F7FA;--text:#1A1A2E;--text2:#666;
  --border:#E0E4E8;--radius:14px;--radius-sm:10px;--shadow:0 2px 16px rgba(0,0,0,.08);
  --metro:#E74C3C;--bus:#2ECC71;--walk:#F39C12;--transfer:#9B59B6;
  --sheet-height:40vh;--topbar-h:56px;
  --safe-bottom:env(safe-area-inset-bottom,16px);
}
html,body{height:100%;width:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:15px;color:var(--text);background:var(--bg);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}

/* ========== Map ========== */
#map{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
.leaflet-control-zoom{display:none}
.leaflet-control-attribution{font-size:9px!important;opacity:.5;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ========== Top Bar ========== */
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top,12px))}
.search-box{display:flex;align-items:center;background:var(--bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:2px;gap:0}
.search-input{flex:1;border:none;outline:none;padding:12px 14px;font-size:16px;background:transparent;color:var(--text);min-width:0;border-radius:var(--radius) 0 0 var(--radius)}
.search-input::placeholder{color:#B0B8C1}
.btn-icon{width:44px;height:44px;border:none;background:transparent;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--primary);font-size:20px;flex-shrink:0;transition:background .15s}
.btn-icon:active{background:var(--bg2)}
.btn-icon.locating{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.search-clear{display:none;color:var(--text2)}
.search-clear.show{display:flex}

/* ========== Suggestions Dropdown ========== */
.suggestions{position:fixed;top:80px;left:14px;right:14px;z-index:110;background:var(--bg);border-radius:var(--radius);box-shadow:0 4px 24px rgba(0,0,0,.12);max-height:300px;overflow-y:auto;display:none}
.suggestions.show{display:block}
.sug-item{padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .1s}
.sug-item:last-child{border-bottom:none}
.sug-item:active,.sug-item:hover{background:var(--bg2)}
.sug-icon{font-size:18px;flex-shrink:0;width:28px;text-align:center}
.sug-text{flex:1;min-width:0}
.sug-name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug-addr{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

/* ========== Action Buttons ========== */
.action-bar{position:fixed;top:140px;right:14px;z-index:100;display:flex;flex-direction:column;gap:8px}
.btn-action{width:44px;height:44px;border-radius:50%;border:none;background:var(--bg);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--text);transition:all .15s}
.btn-action:active{background:var(--bg2);transform:scale(.95)}
.btn-action.primary{background:var(--primary);color:#fff}
.btn-action.danger{background:var(--danger);color:#fff}

/* ========== Bottom Sheet ========== */
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.1);transition:transform .35s cubic-bezier(.4,0,.2,1),height .35s cubic-bezier(.4,0,.2,1);transform:translateY(calc(100% - 52px));height:var(--sheet-height);display:flex;flex-direction:column}
.sheet.expanded{transform:translateY(0);height:68vh}
.sheet.collapsed{transform:translateY(calc(100% - 52px))}
.sheet-handle{display:flex;justify-content:center;padding:12px 0 8px;cursor:pointer;flex-shrink:0}
.sheet-handle-bar{width:36px;height:4px;border-radius:2px;background:#D0D5DD}
.sheet-header{padding:4px 20px 12px;flex-shrink:0;border-bottom:1px solid var(--border)}
.sheet-title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px}
.sheet-meta{font-size:13px;color:var(--text2);margin-top:4px;display:flex;gap:16px}
.sheet-body{flex:1;overflow-y:auto;padding:12px 20px 20px;-webkit-overflow-scrolling:touch;padding-bottom:calc(20px + var(--safe-bottom))}
.sheet-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text2);text-align:center;padding:20px}
.sheet-empty-icon{font-size:48px;margin-bottom:12px;opacity:.6}
.sheet-empty-text{font-size:14px;line-height:1.6}

/* ========== Route Card ========== */
.route-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.route-tab{padding:8px 16px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;color:var(--text);white-space:nowrap}
.route-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.route-tab-time{font-size:11px;opacity:.7;margin-left:4px}

.step-list{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.step:last-child{border-bottom:none}
.step-icon-wrap{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px;position:relative}
.step-icon-wrap.metro{background:#FDEDEC;color:var(--metro)}
.step-icon-wrap.bus{background:#E8F8F0;color:var(--bus)}
.step-icon-wrap.walk{background:#FEF5E7;color:var(--walk)}
.step-icon-wrap.transfer{background:#F4ECF7;color:var(--transfer)}
.step-content{flex:1;min-width:0;padding-top:2px}
.step-title{font-size:14px;font-weight:600;line-height:1.4}
.step-detail{font-size:12px;color:var(--text2);margin-top:3px;line-height:1.5}
.step-line-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;margin-left:6px;vertical-align:middle}
.step-line-badge.metro{background:var(--metro);color:#fff}
.step-line-badge.bus{background:var(--bus);color:#fff}
.step-line-badge.walk{background:var(--walk);color:#fff}

.route-summary{display:flex;gap:12px;padding:14px 16px;background:var(--bg2);border-radius:var(--radius-sm);margin-bottom:14px;flex-wrap:wrap}
.route-summary-item{display:flex;flex-direction:column;align-items:center;min-width:60px}
.route-summary-val{font-size:18px;font-weight:700;color:var(--primary)}
.route-summary-label{font-size:11px;color:var(--text2);margin-top:2px}

/* ========== Loading & Toast ========== */
.loading-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.3);display:none;align-items:center;justify-content:center}
.loading-overlay.show{display:flex}
.loading-spinner{background:var(--bg);border-radius:var(--radius);padding:24px 32px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.loading-spinner-icon{font-size:36px;animation:spin .8s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-spinner-text{font-size:14px;color:var(--text2)}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:300;background:#1A1A2E;color:#fff;padding:12px 22px;border-radius:24px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap}
.toast.show{opacity:1}
.toast.error{background:var(--danger)}

/* ========== Settings Modal ========== */
.modal-overlay{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:80vh;overflow-y:auto;padding:8px 20px 20px;padding-bottom:calc(20px + var(--safe-bottom))}
.modal-title{font-size:18px;font-weight:700;text-align:center;padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:16px}
.modal-section{margin-bottom:20px}
.modal-label{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.modal-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;outline:none;transition:border-color .2s}
.modal-input:focus{border-color:var(--primary)}
.modal-hint{font-size:12px;color:var(--text2);margin-top:6px;line-height:1.5}
.modal-hint a{color:var(--primary)}
.modal-btn{width:100%;padding:14px;border:none;border-radius:var(--radius-sm);font-size:16px;font-weight:600;cursor:pointer;transition:all .15s}
.modal-btn.primary{background:var(--primary);color:#fff}
.modal-btn.primary:active{background:var(--primary-dark)}
.modal-btn.secondary{background:var(--bg2);color:var(--text);margin-top:8px}

/* ========== My Location Marker ========== */
.marker-me{width:22px;height:22px;background:var(--primary);border:3px solid #fff;border-radius:50%;box-shadow:0 2px 8px rgba(74,144,217,.4);position:relative}
.marker-me::after{content:'';position:absolute;top:50%;left:50%;width:40px;height:40px;background:rgba(74,144,217,.12);border-radius:50%;transform:translate(-50%,-50%);animation:pulse-ring 2s ease-out infinite}
@keyframes pulse-ring{0%{transform:translate(-50%,-50%) scale(.5);opacity:1}100%{transform:translate(-50%,-50%) scale(2);opacity:0}}

.marker-dest{width:32px;height:42px;position:relative}
.marker-dest::before{content:'📌';font-size:28px;position:absolute;top:0;left:50%;transform:translateX(-50%);filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}

.marker-station{width:14px;height:14px;background:#fff;border:2.5px solid var(--metro);border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.15)}

/* ========== Responsive ========== */
@media(min-width:768px){
  .topbar{max-width:500px;left:50%;transform:translateX(-50%);padding-left:0;padding-right:0}
  .suggestions{max-width:472px;left:50%;transform:translateX(-50%)}
  .action-bar{right:calc(50% - 250px + 14px)}
}
@media(min-width:1024px){
  #map{left:0;width:100%}
  .sheet{left:50%;transform:translate(-50%,calc(100% - 52px));max-width:500px}
  .sheet.expanded{transform:translate(-50%,0)}
}

/* ========== Leaflet overrides ========== */
.leaflet-popup-content-wrapper{border-radius:var(--radius-sm);box-shadow:0 4px 16px rgba(0,0,0,.12)}
.leaflet-popup-content{margin:10px 14px;font-size:13px;font-family:inherit}
.custom-div-icon{border:none!important;background:none!important}
</style>
</head>
<body>

<!-- Map -->
<div id="map"></div>

<!-- Top Bar -->
<div class="topbar">
  <div class="search-box">
    <input type="text" class="search-input" id="searchInput" placeholder="搜索目的地、地标、地址..." autocomplete="off" enterkeyhint="search">
    <button class="btn-icon search-clear" id="searchClear" title="清除">✕</button>
    <button class="btn-icon" id="searchBtn" title="搜索">🔍</button>
  </div>
</div>

<!-- Suggestions -->
<div class="suggestions" id="suggestions"></div>

<!-- Action Buttons -->
<div class="action-bar">
  <button class="btn-action" id="btnLocate" title="我的位置">📍</button>
  <button class="btn-action" id="btnSettings" title="设置">⚙️</button>
  <button class="btn-action danger" id="btnClear" title="清除路线" style="display:none">✕</button>
</div>

<!-- Bottom Sheet -->
<div class="sheet collapsed" id="sheet">
  <div class="sheet-handle" id="sheetHandle">
    <div class="sheet-handle-bar"></div>
  </div>
  <div class="sheet-header" id="sheetHeader">
    <div class="sheet-title" id="sheetTitle">🗺️ 想去哪里？</div>
    <div class="sheet-meta" id="sheetMeta"></div>
  </div>
  <div class="sheet-body" id="sheetBody">
    <div class="sheet-empty" id="sheetEmpty">
      <div class="sheet-empty-icon">🚇</div>
      <div class="sheet-empty-text">
        在上方搜索目的地<br>自动规划公交地铁换乘路线
      </div>
    </div>
    <div id="routeContent" style="display:none"></div>
  </div>
</div>

<!-- Loading -->
<div class="loading-overlay" id="loading">
  <div class="loading-spinner">
    <div class="loading-spinner-icon">⏳</div>
    <div class="loading-spinner-text" id="loadingText">计算路线中...</div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <div class="modal-title">⚙️ 设置</div>
    <div class="modal-section">
      <div class="modal-label">OpenRouteService API Key</div>
      <input type="text" class="modal-input" id="orsKeyInput" placeholder="输入你的免费 API Key...">
      <div class="modal-hint">
        用于公交/地铁换乘路线规划。免费注册获取 👉
        <a href="https://openrouteservice.org/dev/#/signup" target="_blank">openrouteservice.org</a><br>
        免费额度：2000次/天，足够日常使用。<br>
        不填也可以使用步行导航。
      </div>
    </div>
    <div class="modal-section">
      <div class="modal-label">地图风格</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap" id="tileOptions">
        <button class="route-tab active" data-tile="osm">标准地图</button>
        <button class="route-tab" data-tile="carto-light">浅色地图</button>
        <button class="route-tab" data-tile="carto-dark">暗色地图</button>
      </div>
    </div>
    <button class="modal-btn primary" id="saveSettings">保存设置</button>
    <button class="modal-btn secondary" id="closeSettings">取消</button>
  </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* ================================================================
   Transit Go · 出行导航 — 核心逻辑
   ================================================================ */

// ---- DOM refs ----
const $ = id => document.getElementById(id);
const mapEl = $('map');
const searchInput = $('searchInput');
const searchClear = $('searchClear');
const suggestions = $('suggestions');
const sheet = $('sheet');
const sheetTitle = $('sheetTitle');
const sheetMeta = $('sheetMeta');
const sheetBody = $('sheetBody');
const sheetEmpty = $('sheetEmpty');
const routeContent = $('routeContent');
const loading = $('loading');
const loadingText = $('loadingText');
const toast = $('toast');
const btnLocate = $('btnLocate');
const btnClear = $('btnClear');
const btnSettings = $('btnSettings');
const settingsModal = $('settingsModal');
const orsKeyInput = $('orsKeyInput');

// ---- Config ----
const CONFIG = {
  orsKey: '',
  tileStyle: 'osm',
  searchTimeout: null,
  geocodingCache: new Map()
};

// Load saved config
try {
  const saved = JSON.parse(localStorage.getItem('transitgo_config') || '{}');
  if (saved.orsKey) CONFIG.orsKey = saved.orsKey;
  if (saved.tileStyle) CONFIG.tileStyle = saved.tileStyle;
} catch(e) {}

orsKeyInput.value = CONFIG.orsKey;

// ---- Map ----
const map = L.map('map', {
  zoomControl: false,
  attributionControl: true
}).setView([39.9042, 116.4074], 13); // Default: Beijing

// Tile layers
const tileLayers = {
  'osm': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }),
  'carto-light': L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>'
  }),
  'carto-dark': L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>'
  })
};

let currentTile = tileLayers[CONFIG.tileStyle] || tileLayers['osm'];
currentTile.addTo(map);

// ---- State ----
let myPosition = null;          // {lat, lng}
let myMarker = null;
let myAccuracyCircle = null;
let destPosition = null;        // {lat, lng, name}
let destMarker = null;
let routeLines = [];            // array of L.Polyline
let routeMarkers = [];          // array of L.Marker
let stationMarkers = [];        // nearby transit stations
let currentRoutes = [];         // parsed route data
let activeRouteIdx = 0;

// ---- Custom Icons ----
const meIcon = L.divIcon({ className: 'custom-div-icon', html: '<div class="marker-me"></div>', iconSize: [22,22], iconAnchor: [11,11] });
const destIcon = L.divIcon({ className: 'custom-div-icon', html: '<div class="marker-dest"></div>', iconSize: [32,42], iconAnchor: [16,42] });
const stationIcon = L.divIcon({ className: 'custom-div-icon', html: '<div class="marker-station"></div>', iconSize: [14,14], iconAnchor: [7,7] });

// ---- Toast ----
let toastTimer;
function showToast(msg, isError = false) {
  clearTimeout(toastTimer);
  toast.textContent = msg;
  toast.className = 'toast show' + (isError ? ' error' : '');
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
}

// ---- Loading ----
function showLoading(text = '计算路线中...') {
  loadingText.textContent = text;
  loading.classList.add('show');
}
function hideLoading() { loading.classList.remove('show'); }

// ==================== Geolocation ====================
function locateMe(silent = false) {
  if (!navigator.geolocation) {
    if (!silent) showToast('你的设备不支持定位功能', true);
    return;
  }
  if (!silent) showToast('正在定位...');
  btnLocate.classList.add('locating');

  navigator.geolocation.getCurrentPosition(
    pos => {
      myPosition = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      updateMyMarker();
      map.setView([myPosition.lat, myPosition.lng], 15, { animate: true });
      btnLocate.classList.remove('locating');
      if (!silent) showToast('定位成功 ✅');
      // If destination already set, auto recalculate
      if (destPosition) calculateRoutes();
    },
    err => {
      btnLocate.classList.remove('locating');
      let msg = '定位失败';
      if (err.code === 1) msg = '请允许定位权限后重试';
      else if (err.code === 2) msg = '无法获取位置信息，请检查GPS';
      else if (err.code === 3) msg = '定位超时，请重试';
      if (!silent) showToast(msg, true);
      console.warn('Geolocation error:', err);
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
  );
}

function updateMyMarker() {
  if (!myPosition) return;
  if (myMarker) map.removeLayer(myMarker);
  if (myAccuracyCircle) map.removeLayer(myAccuracyCircle);

  myMarker = L.marker([myPosition.lat, myPosition.lng], { icon: meIcon, zIndexOffset: 1000 }).addTo(map);
  myMarker.bindPopup('<b>📍 我的位置</b>').openPopup();
}

// ==================== Search / Geocoding ====================
function buildSearchUrl(query) {
  const params = new URLSearchParams({
    q: query,
    format: 'json',
    limit: '5',
    'accept-language': 'zh',
    countrycodes: 'cn',
    addressdetails: '1'
  });
  return `https://nominatim.openstreetmap.org/search?${params}`;
}

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  searchClear.classList.toggle('show', q.length > 0);

  clearTimeout(CONFIG.searchTimeout);
  if (q.length < 2) { suggestions.classList.remove('show'); return; }

  // Check cache
  if (CONFIG.geocodingCache.has(q)) {
    renderSuggestions(CONFIG.geocodingCache.get(q));
    return;
  }

  CONFIG.searchTimeout = setTimeout(() => {
    fetch(buildSearchUrl(q))
      .then(r => r.json())
      .then(data => {
        CONFIG.geocodingCache.set(q, data);
        if (searchInput.value.trim() === q) renderSuggestions(data);
      })
      .catch(() => {});
  }, 400);
});

searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const q = searchInput.value.trim();
    if (q) searchAndGo(q);
  }
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.classList.remove('show');
  suggestions.classList.remove('show');
});

function renderSuggestions(data) {
  if (!data || data.length === 0) {
    suggestions.innerHTML = '<div class="sug-item" style="color:var(--text2);justify-content:center">未找到结果</div>';
    suggestions.classList.add('show');
    return;
  }
  suggestions.innerHTML = data.map((item, i) => {
    const name = item.display_name.split(',')[0] || item.display_name;
    const addr = item.display_name.split(',').slice(1).join(',').trim();
    const icon = item.category === 'railway' ? '🚉' :
                 item.type === 'bus_station' ? '🚌' :
                 item.category === 'amenity' ? '🏛️' : '📍';
    return `<div class="sug-item" data-idx="${i}">
      <span class="sug-icon">${icon}</span>
      <div class="sug-text">
        <div class="sug-name">${escapeHtml(name)}</div>
        <div class="sug-addr">${escapeHtml(addr)}</div>
      </div>
    </div>`;
  }).join('');
  suggestions.classList.add('show');
}

suggestions.addEventListener('click', e => {
  const item = e.target.closest('.sug-item');
  if (!item) return;
  const idx = parseInt(item.dataset.idx);
  const q = searchInput.value.trim();
  const data = CONFIG.geocodingCache.get(q);
  if (data && data[idx]) {
    selectDestination(data[idx]);
  }
});

function searchAndGo(query) {
  suggestions.classList.remove('show');
  searchInput.blur();
  showLoading('搜索中...');
  fetch(buildSearchUrl(query))
    .then(r => r.json())
    .then(data => {
      hideLoading();
      if (!data || data.length === 0) { showToast('未找到该地点', true); return; }
      selectDestination(data[0]);
    })
    .catch(() => { hideLoading(); showToast('搜索失败，请检查网络', true); });
}

function selectDestination(item) {
  destPosition = {
    lat: parseFloat(item.lat),
    lng: parseFloat(item.lon),
    name: item.display_name.split(',')[0] || item.display_name
  };
  suggestions.classList.remove('show');
  searchInput.value = destPosition.name;
  searchClear.classList.add('show');

  // Update marker
  if (destMarker) map.removeLayer(destMarker);
  destMarker = L.marker([destPosition.lat, destPosition.lng], { icon: destIcon, zIndexOffset: 999 }).addTo(map);

  // Fit map to show both
  if (myPosition) {
    const bounds = L.latLngBounds(
      [myPosition.lat, myPosition.lng],
      [destPosition.lat, destPosition.lng]
    );
    map.fitBounds(bounds, { padding: [60, 60], maxZoom: 15, animate: true });
  } else {
    map.setView([destPosition.lat, destPosition.lng], 15, { animate: true });
  }

  btnClear.style.display = 'flex';

  updateSheetHeader();

  if (!myPosition) {
    showToast('请先点击 📍 定位你的位置');
    locateMe(true);
    return;
  }

  calculateRoutes();
}

function updateSheetHeader() {
  if (destPosition) {
    sheetTitle.innerHTML = `📍 ${escapeHtml(destPosition.name)}`;
  }
}

// ==================== Routing ====================

// -- OSRM Walking Route (free, no key) --
function buildOsrmUrl(from, to) {
  return `https://router.project-osrm.org/route/v1/foot/${from.lng},${from.lat};${to.lng},${to.lat}?overview=full&steps=true&alternatives=true&geometries=geojson&continue_straight=false`;
}

function parseOsrmRoute(data, idx) {
  if (!data || !data.routes || !data.routes[idx]) return null;
  const route = data.routes[idx];
  const steps = [];
  let totalWalkDist = 0;

  route.legs.forEach(leg => {
    leg.steps.forEach(step => {
      const dist = Math.round(step.distance);
      totalWalkDist += dist;
      steps.push({
        type: 'walk',
        instruction: step.maneuver.type === 'depart' ? '从起点出发' :
                     step.maneuver.type === 'arrive' ? '到达目的地' :
                     step.maneuver.type === 'turn' ? `${step.maneuver.modifier || ''}转` :
                     step.maneuver.type === 'new name' ? `沿路继续` :
                     `继续前行`,
        street: step.name || '无名路',
        distance: dist,
        duration: Math.round(step.duration)
      });
    });
  });

  return {
    type: 'walking',
    summary: {
      distance: Math.round(route.distance),
      duration: Math.round(route.duration),
      walks: totalWalkDist
    },
    coords: route.geometry.coordinates.map(c => [c[1], c[0]]),
    steps: steps,
    label: `🚶 步行 ${formatDistance(route.distance)} · ${formatDuration(route.duration)}`
  };
}

// -- ORS Public Transit Route (free key needed) --
function buildOrsTransitUrl() {
  return 'https://api.openrouteservice.org/v2/directions/public-transit';
}

function buildOrsTransitBody(from, to) {
  return {
    coordinates: [[from.lng, from.lat], [to.lng, to.lat]],
    preference: 'recommended',
    language: 'zh'
  };
}

function parseOrsTransitRoute(data, idx) {
  if (!data || !data.routes || !data.routes[idx]) return null;
  const route = data.routes[idx];
  const segments = route.segments || [];
  const steps = [];
  let totalWalk = 0;
  let totalTransit = 0;
  let metroCount = 0, busCount = 0;

  segments.forEach(seg => {
    seg.steps.forEach(step => {
      const dist = Math.round(step.distance);
      if (step.type === 'walk' || step.type === '11') {
        totalWalk += dist;
        steps.push({
          type: 'walk',
          instruction: step.instruction || '步行',
          street: step.name || '',
          distance: dist,
          duration: Math.round(step.duration)
        });
      } else if (step.type === 'transit' || step.type === '12' || step.type === 'pt') {
        totalTransit += dist;
        const transitType = (step.name || '').includes('地铁') || (step.name || '').includes('Metro') || (step.name || '').includes('Subway') ? 'metro' : 'bus';
        if (transitType === 'metro') metroCount++; else busCount++;
        steps.push({
          type: transitType,
          instruction: step.instruction || `乘坐 ${step.name || '公共交通'}`,
          line: step.name || '',
          lineRef: step.ref || '',
          departure: step.departure_stop || step.departure || '',
          arrival: step.arrival_stop || step.arrival || '',
          stops: step.stops || 0,
          distance: dist,
          duration: Math.round(step.duration)
        });
      } else if (step.type === 'transfer' || step.type === '13') {
        steps.push({
          type: 'transfer',
          instruction: step.instruction || '换乘',
          distance: dist,
          duration: Math.round(step.duration)
        });
      }
    });
  });

  // Build coordinate path from geometry
  let coords = [];
  if (route.geometry) {
    // Decode polyline if needed, or use coordinates
    if (route.geometry.coordinates) {
      coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
    }
  }

  return {
    type: 'transit',
    summary: {
      distance: Math.round(route.summary?.distance || 0),
      duration: Math.round(route.summary?.duration || 0),
      walks: totalWalk,
      transit: totalTransit,
      metroCount, busCount
    },
    coords: coords,
    steps: steps,
    label: buildTransitLabel(route, metroCount, busCount, totalWalk)
  };
}

function buildTransitLabel(route, metroCount, busCount, walkDist) {
  const dur = formatDuration(route.summary?.duration || 0);
  let parts = [];
  if (metroCount > 0) parts.push(`🚇 ${metroCount}次地铁`);
  if (busCount > 0) parts.push(`🚌 ${busCount}次公交`);
  if (walkDist > 200) parts.push(`🚶 步行${formatDistance(walkDist)}`);
  return `${parts.join(' · ')} · ${dur}`;
}

// ==================== Main Calculation ====================
async function calculateRoutes() {
  if (!myPosition || !destPosition) return;

  clearRoutes();
  showLoading('计算路线中...');
  sheetEmpty.style.display = 'none';
  routeContent.style.display = 'block';
  routeContent.innerHTML = '';
  currentRoutes = [];

  const from = { lat: myPosition.lat, lng: myPosition.lng };
  const to = { lat: destPosition.lat, lng: destPosition.lng };

  // 1. Always calculate walking route (OSRM - free)
  try {
    const resp = await fetch(buildOsrmUrl(from, to));
    const data = await resp.json();
    if (data.code === 'Ok') {
      for (let i = 0; i < Math.min(data.routes.length, 2); i++) {
        const route = parseOsrmRoute(data, i);
        if (route) currentRoutes.push(route);
      }
    }
  } catch(e) {
    console.warn('OSRM walking route failed:', e);
  }

  // 2. Try transit route (ORS - needs API key)
  if (CONFIG.orsKey) {
    try {
      const resp = await fetch(buildOrsTransitUrl(), {
        method: 'POST',
        headers: {
          'Authorization': CONFIG.orsKey,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(buildOrsTransitBody(from, to))
      });
      const data = await resp.json();
      if (data.routes && data.routes.length > 0) {
        for (let i = 0; i < Math.min(data.routes.length, 2); i++) {
          const route = parseOrsTransitRoute(data, i);
          if (route) currentRoutes = [route, ...currentRoutes]; // transit first
        }
      }
    } catch(e) {
      console.warn('ORS transit route failed:', e);
    }
  }

  // 3. Also fetch nearby transit stations (Overpass API - free)
  fetchNearbyStations(from);

  hideLoading();

  if (currentRoutes.length === 0) {
    routeContent.innerHTML = '<div class="sheet-empty" style="height:auto;padding:30px"><div class="sheet-empty-icon">😔</div><div class="sheet-empty-text">未找到路线，请尝试更近的目的地<br>或检查网络连接</div></div>';
    return;
  }

  activeRouteIdx = 0;
  renderRouteTabs();
  displayRoute(0);
  sheet.classList.add('expanded');
  sheet.classList.remove('collapsed');
}

// ==================== Nearby Transit Stations (Overpass API) ====================
async function fetchNearbyStations(pos) {
  const radius = 2000; // 2km radius
  const query = `[out:json];(node["public_transport"="station"](around:${radius},${pos.lat},${pos.lng});node["railway"="station"](around:${radius},${pos.lat},${pos.lng});node["railway"="subway_entrance"](around:${radius},${pos.lat},${pos.lng});node["highway"="bus_stop"](around:${radius},${pos.lat},${pos.lng}););out 30;`;

  try {
    const resp = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST',
      body: query,
      headers: { 'Content-Type': 'text/plain' }
    });
    const data = await resp.json();

    // Clear old station markers
    stationMarkers.forEach(m => map.removeLayer(m));
    stationMarkers = [];

    data.elements.forEach(el => {
      if (el.lat && el.lon) {
        const name = el.tags?.name || el.tags?.name_en || '';
        const type = el.tags?.railway === 'subway_entrance' ? '地铁口' :
                     el.tags?.railway === 'station' ? '火车站' :
                     el.tags?.highway === 'bus_stop' ? '公交站' :
                     el.tags?.public_transport === 'station' ? '交通枢纽' : '站点';
        if (!name) return;

        const m = L.marker([el.lat, el.lon], { icon: stationIcon, zIndexOffset: 500 })
          .addTo(map)
          .bindPopup(`<b>${escapeHtml(name)}</b><br><small>${type}</small>`);
        stationMarkers.push(m);
      }
    });
  } catch(e) {
    // Silent fail - nearby stations are a bonus feature
  }
}

// ==================== Display ====================
function renderRouteTabs() {
  const tabs = currentRoutes.map((r, i) => {
    const icon = r.type === 'walking' ? '🚶' : '🚇';
    const active = i === activeRouteIdx ? ' active' : '';
    return `<button class="route-tab${active}" data-idx="${i}">${icon} ${r.label}</button>`;
  }).join('');

  sheetTitle.innerHTML = `📍 ${escapeHtml(destPosition?.name || '目的地')}`;
  sheetMeta.innerHTML = `共 ${currentRoutes.length} 条路线方案`;
  routeContent.innerHTML = `
    <div class="route-tabs">${tabs}</div>
    <div id="stepContainer"></div>
  `;

  // Tab click
  routeContent.querySelectorAll('.route-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      activeRouteIdx = parseInt(tab.dataset.idx);
      renderRouteTabs();
      displayRoute(activeRouteIdx);
    });
  });
}

function displayRoute(idx) {
  const route = currentRoutes[idx];
  if (!route) return;

  // Clear map routes
  clearMapRoutes();

  // Draw route on map
  if (route.coords && route.coords.length > 1) {
    const color = route.type === 'walking' ? '#F39C12' : '#4A90D9';
    const line = L.polyline(route.coords, {
      color: color,
      weight: 5,
      opacity: .7,
      dashArray: route.type === 'walking' ? '10 6' : null
    }).addTo(map);
    routeLines.push(line);

    // Fit bounds
    const bounds = L.latLngBounds(route.coords);
    map.fitBounds(bounds, { padding: [60, 60], maxZoom: 15, animate: true });
  }

  // Render steps
  const stepContainer = $('stepContainer');
  if (!stepContainer) return;

  const summary = route.summary;
  const modeLabels = route.type === 'walking' ?
    [{ val: formatDistance(summary.distance), label: '总距离' },
     { val: formatDuration(summary.duration), label: '预计时间' },
     { val: Math.round(summary.walks / (summary.duration/60) * 60) + ' m/min', label: '步行速度' }] :
    [
     { val: formatDuration(summary.duration), label: '预计时间' },
     { val: formatDistance(summary.distance), label: '总距离' },
     { val: summary.metroCount + ' 条地铁', label: '地铁' },
     { val: summary.busCount + ' 条公交', label: '公交' }
    ];

  const metaHtml = sheetMeta;
  if (metaHtml) {
    metaHtml.innerHTML = route.label;
  }

  let stepsHtml = `
    <div class="route-summary">
      ${modeLabels.filter(m => !m.val.startsWith('0')).map(m => `
        <div class="route-summary-item">
          <div class="route-summary-val">${m.val}</div>
          <div class="route-summary-label">${m.label}</div>
        </div>
      `).join('')}
    </div>
    <div class="step-list">
  `;

  // Group walking steps for cleaner display
  let walkingBuffer = [];
  const flushWalking = () => {
    if (walkingBuffer.length === 0) return;
    if (walkingBuffer.length === 1) {
      stepsHtml += renderStep(walkingBuffer[0]);
    } else {
      const totalDist = walkingBuffer.reduce((s, st) => s + (st.distance || 0), 0);
      const totalDur = walkingBuffer.reduce((s, st) => s + (st.duration || 0), 0);
      stepsHtml += renderStep({
        type: 'walk',
        instruction: '沿路步行',
        distance: totalDist,
        duration: totalDur
      });
    }
    walkingBuffer = [];
  };

  route.steps.forEach((step, i) => {
    if (step.type === 'walk') {
      walkingBuffer.push(step);
    } else {
      flushWalking();
      stepsHtml += renderStep(step);
    }
  });
  flushWalking();

  stepsHtml += '</div>';

  // Add note about API key if no transit routes
  if (route.type === 'walking' && currentRoutes.every(r => r.type === 'walking')) {
    stepsHtml += `
      <div style="margin-top:20px;padding:16px;background:#FFF9E6;border-radius:var(--radius-sm);font-size:13px;color:#8B6914;line-height:1.7">
        💡 <b>提示：</b>当前仅显示步行路线。<br>
        点击右上角 ⚙️ 设置，填入免费 ORS API Key 即可查看公交/地铁换乘方案。<br>
        <a href="https://openrouteservice.org/dev/#/signup" target="_blank" style="color:var(--primary)">免费获取 Key →</a>
      </div>`;
  }

  stepContainer.innerHTML = stepsHtml;
}

function renderStep(step) {
  let iconWrap = '', icon = '', badge = '';
  switch(step.type) {
    case 'metro':
      iconWrap = 'metro'; icon = '🚇';
      badge = step.line ? `<span class="step-line-badge metro">${escapeHtml(step.line)}</span>` : '';
      break;
    case 'bus':
      iconWrap = 'bus'; icon = '🚌';
      badge = step.line ? `<span class="step-line-badge bus">${escapeHtml(step.line)}</span>` : '';
      break;
    case 'walk':
      iconWrap = 'walk'; icon = '🚶';
      break;
    case 'transfer':
      iconWrap = 'transfer'; icon = '🔄';
      break;
  }

  const detail = [];
  if (step.departure) detail.push(`从 <b>${escapeHtml(step.departure)}</b> 上车`);
  if (step.arrival) detail.push(`在 <b>${escapeHtml(step.arrival)}</b> 下车`);
  if (step.stops > 0) detail.push(`途经 ${step.stops} 站`);
  if (step.distance && step.distance > 0) detail.push(formatDistance(step.distance));
  if (step.duration && step.duration > 0) detail.push(formatDuration(step.duration));

  return `
    <div class="step">
      <div class="step-icon-wrap ${iconWrap}">${icon}</div>
      <div class="step-content">
        <div class="step-title">${escapeHtml(step.instruction || '')}${badge}</div>
        ${detail.length > 0 ? `<div class="step-detail">${detail.join(' · ')}</div>` : ''}
      </div>
    </div>`;
}

// ==================== Map Helpers ====================
function clearMapRoutes() {
  routeLines.forEach(l => map.removeLayer(l));
  routeLines = [];
  routeMarkers.forEach(m => map.removeLayer(m));
  routeMarkers = [];
}

function clearRoutes() {
  clearMapRoutes();
  currentRoutes = [];
  activeRouteIdx = 0;
  routeContent.innerHTML = '';
  routeContent.style.display = 'none';
  sheetEmpty.style.display = 'flex';
}

function clearAll() {
  clearRoutes();
  if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
  destPosition = null;
  searchInput.value = '';
  searchClear.classList.remove('show');
  stationMarkers.forEach(m => map.removeLayer(m));
  stationMarkers = [];
  btnClear.style.display = 'none';
  sheet.classList.remove('expanded');
  sheet.classList.add('collapsed');
  sheetTitle.textContent = '🗺️ 想去哪里？';
  sheetMeta.textContent = '';

  if (myPosition) {
    map.setView([myPosition.lat, myPosition.lng], 15, { animate: true });
  }
}

// ==================== Sheet Interaction ====================
let sheetStartY = 0;
let sheetStartTransform = 0;
let isDragging = false;

$('sheetHandle').addEventListener('pointerdown', e => {
  isDragging = true;
  sheetStartY = e.clientY;
  const computed = getComputedStyle(sheet).transform;
  sheetStartTransform = 0;
  if (computed && computed !== 'none') {
    const matrix = new DOMMatrixReadOnly(computed);
    sheetStartTransform = matrix.m42; // translateY
  }
  sheet.style.transition = 'none';
});

document.addEventListener('pointermove', e => {
  if (!isDragging) return;
  const dy = e.clientY - sheetStartY;
  const newY = Math.min(0, Math.max(sheetStartTransform + dy, -window.innerHeight * 0.6));
  sheet.style.transform = `translateY(${newY}px)`;
});

document.addEventListener('pointerup', () => {
  if (!isDragging) return;
  isDragging = false;
  sheet.style.transition = '';

  const computed = getComputedStyle(sheet).transform;
  let currentY = 0;
  if (computed && computed !== 'none') {
    currentY = new DOMMatrixReadOnly(computed).m42;
  }

  // Snap to expanded or collapsed
  const threshold = -window.innerHeight * 0.15;
  if (currentY < threshold) {
    sheet.classList.add('expanded');
    sheet.classList.remove('collapsed');
  } else {
    sheet.classList.remove('expanded');
    sheet.classList.add('collapsed');
  }
});

// Click on sheet header area also toggles
$('sheetHeader').addEventListener('click', () => {
  if (isDragging) return;
  if (sheet.classList.contains('expanded')) {
    sheet.classList.remove('expanded');
    sheet.classList.add('collapsed');
  } else if (destPosition) {
    sheet.classList.add('expanded');
    sheet.classList.remove('collapsed');
  }
});

// ==================== Buttons ====================
btnLocate.addEventListener('click', () => locateMe());
btnClear.addEventListener('click', clearAll);

btnSettings.addEventListener('click', () => {
  settingsModal.classList.add('show');
});

$('closeSettings').addEventListener('click', () => {
  settingsModal.classList.remove('show');
});

$('saveSettings').addEventListener('click', () => {
  CONFIG.orsKey = orsKeyInput.value.trim();
  CONFIG.tileStyle = document.querySelector('#tileOptions .route-tab.active')?.dataset?.tile || 'osm';

  // Save
  localStorage.setItem('transitgo_config', JSON.stringify({
    orsKey: CONFIG.orsKey,
    tileStyle: CONFIG.tileStyle
  }));

  // Update tile
  map.removeLayer(currentTile);
  currentTile = tileLayers[CONFIG.tileStyle] || tileLayers['osm'];
  currentTile.addTo(map);

  settingsModal.classList.remove('show');
  showToast('设置已保存 ✅');

  // Recalculate if both positions exist
  if (myPosition && destPosition) calculateRoutes();
});

settingsModal.addEventListener('click', e => {
  if (e.target === settingsModal) settingsModal.classList.remove('show');
});

// Tile style buttons
document.querySelectorAll('#tileOptions .route-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#tileOptions .route-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// Init active tile button
const activeTileBtn = document.querySelector(`#tileOptions [data-tile="${CONFIG.tileStyle}"]`);
if (activeTileBtn) {
  document.querySelectorAll('#tileOptions .route-tab').forEach(b => b.classList.remove('active'));
  activeTileBtn.classList.add('active');
}

// ==================== Keyboard Shortcuts ====================
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    suggestions.classList.remove('show');
    settingsModal.classList.remove('show');
    searchInput.blur();
  }
});

// ==================== Init ====================
function init() {
  // Auto-locate on load
  locateMe(true);

  // Handle window resize
  window.addEventListener('resize', () => {
    map.invalidateSize();
  });

  // Hide suggestions on map click
  map.on('click', () => {
    suggestions.classList.remove('show');
    searchInput.blur();
  });

  // Handle map move for dynamic nearby stations (debounced)
  let stationFetchTimer;
  map.on('moveend', () => {
    clearTimeout(stationFetchTimer);
    if (destPosition && myPosition) {
      // Don't re-fetch stations during navigation to avoid noise
    }
  });
}

// ==================== Utilities ====================
function formatDistance(meters) {
  if (meters < 1000) return Math.round(meters) + ' 米';
  return (meters / 1000).toFixed(1) + ' 公里';
}

function formatDuration(seconds) {
  if (seconds < 60) return Math.round(seconds) + ' 秒';
  if (seconds < 3600) return Math.round(seconds / 60) + ' 分钟';
  const h = Math.floor(seconds / 3600);
  const m = Math.round((seconds % 3600) / 60);
  return h + ' 小时' + (m > 0 ? m + ' 分钟' : '');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

init();
