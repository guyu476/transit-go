<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#396AFC">
<title>Transit Go · 出行导航</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#396AFC;--blue-l:#E8EEFF;--blue-d:#2851D1;
  --red:#E8553D;--red-l:#FDEAE7;
  --green:#2CA472;--green-l:#E6F6EF;
  --amber:#E89520;--amber-l:#FDF3E3;
  --purple:#7C5CE7;--purple-l:#F1EDFC;
  --g50:#F8F9FB;--g100:#EEF1F5;--g200:#DDE1E8;--g400:#8B95A5;--g600:#4A5568;--g800:#1E293B;
  --safe-b:env(safe-area-inset-bottom,16px);
}
html,body{height:100%;width:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:15px;color:var(--g800);background:#EDF0F5;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#map{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
.leaflet-control-zoom{display:none}
.leaflet-control-attribution{font-size:9px!important;opacity:.4;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(255,255,255,.7)!important;padding:2px 6px!important;border-radius:4px!important}

/* ===== Top Bar: Origin + Destination ===== */
.topbar{position:fixed;top:0;left:10px;right:10px;z-index:100;padding-top:max(10px,env(safe-area-inset-top,10px))}
.route-card{background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:16px;box-shadow:0 2px 20px rgba(0,0,0,.06);overflow:hidden;margin-bottom:6px}
.route-row{display:flex;align-items:center;padding:0 8px;gap:2px}
.route-row:first-child{border-bottom:1px solid var(--g100)}
.route-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.route-dot.from{background:var(--blue);box-shadow:0 0 0 3px rgba(57,106,252,.12)}
.route-dot.to{background:var(--red);box-shadow:0 0 0 3px rgba(232,85,61,.12)}
.route-input{flex:1;border:none;outline:none;padding:13px 4px;font-size:15px;background:transparent;color:var(--g800);min-width:0;font-weight:500}
.route-input::placeholder{color:var(--g400);font-weight:400}
.route-clr{width:28px;height:28px;border:none;background:var(--g100);border-radius:50%;display:none;align-items:center;justify-content:center;cursor:pointer;color:var(--g400);font-size:13px;flex-shrink:0}
.route-clr.show{display:flex}
.route-clr:active{background:var(--g200)}
.btn-swap{width:34px;height:34px;border:none;background:var(--blue-l);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;flex-shrink:0;color:var(--blue);transition:all .25s}
.btn-swap:active{transform:rotate(180deg);background:var(--blue);color:#fff}
.btn-sm{width:36px;height:36px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;flex-shrink:0;transition:all .15s}
.btn-sm.w{background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 2px 10px rgba(0,0,0,.05);color:var(--g600)}
.btn-sm.w:active{background:#fff;transform:scale(.93)}
.btn-sm.w.locating{animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.topbar-btns{display:flex;gap:6px;justify-content:flex-end}

/* ===== Suggestions ===== */
.suggestions{position:fixed;top:140px;left:10px;right:10px;z-index:110;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:16px;box-shadow:0 4px 32px rgba(0,0,0,.1);max-height:280px;overflow-y:auto;display:none}
.suggestions.show{display:block}
.sug-item{padding:13px 16px;cursor:pointer;display:flex;align-items:center;gap:10px}
.sug-item+.sug-item{border-top:1px solid var(--g100)}
.sug-item:active{background:var(--g50)}
.sug-icon{font-size:18px;flex-shrink:0;width:30px;height:30px;border-radius:8px;background:var(--g50);display:flex;align-items:center;justify-content:center}
.sug-text{flex:1;min-width:0}
.sug-name{font-size:14px;font-weight:600;color:var(--g800);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug-addr{font-size:11px;color:var(--g400);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}

/* ===== Settings Tab ===== */
.settings-tab{position:fixed;right:0;top:35%;z-index:105;display:flex;align-items:center;transform:translateX(calc(100% - 32px));transition:transform .3s}
.settings-tab.open{transform:translateX(0)}
.st-arrow{width:32px;height:48px;background:var(--blue);color:#fff;border-radius:12px 0 0 12px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;flex-shrink:0;box-shadow:-2px 0 12px rgba(57,106,252,.2)}
.st-body{background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);padding:16px;width:260px;max-height:60vh;overflow-y:auto;border-radius:12px 0 0 12px;box-shadow:-2px 4px 20px rgba(0,0,0,.06)}
.st-body label{font-size:11px;font-weight:700;color:var(--g400);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.st-body input{width:100%;padding:10px 12px;border:1.5px solid var(--g200);border-radius:8px;font-size:13px;outline:none;margin-bottom:12px;background:var(--g50)}
.st-body input:focus{border-color:var(--blue)}
.st-body .tiles{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.st-body .tile-opt{padding:6px 10px;border-radius:14px;border:1.5px solid var(--g200);font-size:11px;cursor:pointer;font-weight:600;background:#fff;color:var(--g600)}
.st-body .tile-opt.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.st-body .hint{font-size:11px;color:var(--g400);line-height:1.5;margin-bottom:12px}
.st-body .hint a{color:var(--blue);font-weight:600}
.btn-save{width:100%;padding:10px;border:none;border-radius:10px;background:var(--blue);color:#fff;font-size:14px;font-weight:700;cursor:pointer}

/* ===== Favorites ===== */
.fav-overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.3);display:none;align-items:flex-end;justify-content:center}
.fav-overlay.show{display:flex}
.fav-panel{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:70vh;overflow-y:auto;padding:4px 16px 20px;padding-bottom:calc(20px + var(--safe-b))}
.fav-header{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--g100);margin-bottom:8px}
.fav-title{font-size:17px;font-weight:700}
.fav-close{width:32px;height:32px;border:none;background:var(--g100);border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.fav-empty{padding:40px 0;text-align:center;color:var(--g400)}
.fav-item{padding:14px 12px;border-radius:12px;background:var(--g50);margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .15s}
.fav-item:active{background:var(--blue-l)}
.fav-item-route{flex:1;min-width:0}
.fav-item-from{font-size:13px;font-weight:600;color:var(--blue)}
.fav-item-to{font-size:13px;font-weight:600;color:var(--red);margin-top:2px}
.fav-item-date{font-size:10px;color:var(--g400);margin-top:4px}
.fav-item-del{width:28px;height:28px;border:none;background:var(--g200);border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--g400);flex-shrink:0}

/* ===== Bottom Route Card ===== */
.route-card-bot{position:fixed;left:0;right:0;z-index:100;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -4px 40px rgba(0,0,0,.08);display:flex;flex-direction:column;transition:bottom .35s cubic-bezier(.25,.8,.25,1)}
.rc-handle{display:flex;justify-content:center;padding:12px 0 6px;cursor:ns-resize;flex-shrink:0;touch-action:none}
.rc-handle-bar{width:32px;height:4px;border-radius:2px;background:var(--g200)}
.rc-header{display:flex;align-items:center;justify-content:space-between;padding:0 18px 10px;flex-shrink:0}
.rc-title{font-size:16px;font-weight:700}
.rc-body{flex:1;overflow-y:auto;padding:0 16px 16px;-webkit-overflow-scrolling:touch;padding-bottom:calc(16px + var(--safe-b))}

/* ===== Route Common ===== */
.route-tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 0;margin-bottom:12px}
.route-tabs::-webkit-scrollbar{display:none}
.route-tab{padding:8px 14px;border-radius:18px;border:none;background:var(--g100);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;color:var(--g600)}
.route-tab.active{background:var(--blue);color:#fff;box-shadow:0 3px 10px rgba(57,106,252,.25)}
.route-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:6px;padding:12px;background:linear-gradient(135deg,var(--blue-l),#DFE8FF);border-radius:12px;margin-bottom:14px}
.route-summary-item{text-align:center;padding:4px}
.route-summary-val{font-size:18px;font-weight:800;color:var(--blue-d)}
.route-summary-label{font-size:10px;color:var(--blue);font-weight:600;opacity:.7}
.flow-bar{display:flex;align-items:center;gap:2px;padding:10px 8px;background:var(--g50);border-radius:10px;margin-bottom:12px;overflow-x:auto}
.flow-bar::-webkit-scrollbar{display:none}
.flow-line{width:14px;height:3px;border-radius:2px;flex-shrink:0}
.flow-line.walk{background:var(--amber)}
.flow-line.metro{background:var(--red)}
.flow-line.bus{background:var(--green)}
.flow-label{font-size:11px;color:var(--g600);white-space:nowrap;font-weight:600}
.step{display:flex;gap:10px;padding:14px 0;align-items:flex-start}
.step+.step{border-top:1px solid var(--g100)}
.step-num{width:26px;height:26px;border-radius:50%;background:var(--g100);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--g400);flex-shrink:0;margin-top:2px}
.step-icon-wrap{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:19px}
.step-icon-wrap.metro{background:var(--red-l);color:var(--red)}
.step-icon-wrap.bus{background:var(--green-l);color:var(--green)}
.step-icon-wrap.walk{background:var(--amber-l);color:var(--amber)}
.step-icon-wrap.transfer{background:var(--purple-l);color:var(--purple)}
.step-content{flex:1;min-width:0}
.step-title{font-size:14px;font-weight:700;color:var(--g800);line-height:1.3}
.step-stations{display:flex;align-items:center;gap:6px;margin-top:6px;padding:10px 12px;background:var(--g50);border-radius:8px}
.step-station{font-weight:700;color:var(--g800);font-size:13px}
.step-arrow{color:var(--g400);font-size:16px}
.step-stops{color:var(--g400);font-size:11px;margin-left:4px}
.step-info{font-size:11px;color:var(--g400);margin-top:4px}

/* ===== Toast / Loading ===== */
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:300;background:var(--g800);color:#fff;padding:11px 24px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.toast.show{opacity:1}
.toast.error{background:var(--red)}
.loading-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.2);display:none;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.loading-overlay.show{display:flex}
.loading-spinner{background:#fff;border-radius:16px;padding:24px 30px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.1)}
.loading-spinner-icon{font-size:36px;animation:spin .7s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-spinner-text{font-size:13px;color:var(--g400);font-weight:600}

/* ===== Markers ===== */
.marker-me{width:18px;height:18px;background:var(--blue);border:3px solid #fff;border-radius:50%;box-shadow:0 2px 10px rgba(57,106,252,.4);position:relative}
.marker-me::after{content:'';position:absolute;top:50%;left:50%;width:40px;height:40px;background:rgba(57,106,252,.08);border-radius:50%;transform:translate(-50%,-50%);animation:pulse-ring 2s ease-out infinite}
@keyframes pulse-ring{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(-50%,-50%) scale(2.5);opacity:0}}
.marker-dest{width:18px;height:18px;background:var(--red);border:3px solid #fff;border-radius:50%;box-shadow:0 2px 10px rgba(232,85,61,.4);position:relative}
.marker-dest::after{content:'';position:absolute;top:50%;left:50%;width:30px;height:30px;background:rgba(232,85,61,.08);border-radius:50%;transform:translate(-50%,-50%);animation:pulse-ring2 2s ease-out infinite}
@keyframes pulse-ring2{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(-50%,-50%) scale(2.5);opacity:0}}
.custom-div-icon{border:none!important;background:none!important}

@media(min-width:768px){.topbar{max-width:500px;left:50%;transform:translateX(-50%);padding-left:0;padding-right:0}.suggestions{max-width:480px;left:50%;transform:translateX(-50%)}}
@media(min-width:1024px){.route-card-bot{left:50%;right:auto;width:500px;margin-left:-250px}}
</style>
</head>
<body>
<div id="map"></div>

<!-- Top Bar -->
<div class="topbar">
  <div class="route-card">
    <div class="route-row">
      <div class="route-dot from"></div>
      <input type="text" class="route-input" id="inputFrom" placeholder="起点 · GPS自动定位" autocomplete="off" enterkeyhint="next">
      <button class="route-clr" id="clearFrom">✕</button>
    </div>
    <div class="route-row">
      <div class="route-dot to"></div>
      <input type="text" class="route-input" id="inputTo" placeholder="终点 · 搜索目的地" autocomplete="off" enterkeyhint="search">
      <button class="btn-swap" id="btnSwap" title="交换起点终点">⇅</button>
      <button class="route-clr" id="clearTo">✕</button>
    </div>
  </div>
  <div class="topbar-btns">
    <button class="btn-sm w" id="btnLocate" title="GPS定位">📍</button>
    <button class="btn-sm w" id="btnFav" title="收藏路线">⭐</button>
  </div>
</div>

<!-- Suggestions -->
<div class="suggestions" id="suggestions"></div>

<!-- Settings Tab -->
<div class="settings-tab" id="settingsTab">
  <div class="st-arrow" id="settingsArrow">◀</div>
  <div class="st-body">
    <label>高德 API Key</label>
    <input type="text" id="amapKeyInput" placeholder="输入 Key 启用公交路线...">
    <div class="hint">去 <a href="https://lbs.amap.com/" target="_blank">lbs.amap.com</a> 免费注册，选「Web服务」。不填可用步行导航。</div>
    <label>地图风格</label>
    <div class="tiles" id="tileOptions">
      <button class="tile-opt active" data-tile="amap">高德</button>
      <button class="tile-opt" data-tile="osm">OSM</button>
      <button class="tile-opt" data-tile="carto-light">浅色</button>
      <button class="tile-opt" data-tile="carto-dark">暗色</button>
    </div>
    <button class="btn-save" id="saveSettings">保存设置</button>
  </div>
</div>

<!-- Favorites -->
<div class="fav-overlay" id="favOverlay">
  <div class="fav-panel">
    <div class="fav-header"><div class="fav-title">⭐ 收藏路线</div><button class="fav-close" id="favClose">✕</button></div>
    <div id="favList"></div>
  </div>
</div>

<!-- Bottom Route Card -->
<div class="route-card-bot collapsed" id="routeCard">
  <div class="rc-handle" id="routeHandle"><div class="rc-handle-bar"></div></div>
  <div class="rc-header">
    <div class="rc-title" id="routeTitle">路线方案</div>
    <button class="btn-sm w" id="btnSaveRoute" style="display:none;font-size:20px">⭐</button>
  </div>
  <div class="rc-body" id="routeBody">
    <div id="routeContent"></div>
    <div id="routeEmpty" style="text-align:center;color:var(--g400);padding:50px 20px">
      <div style="font-size:48px;opacity:.3;margin-bottom:8px">🗺️</div>
      <div style="font-size:14px;font-weight:500">设置起点和终点，自动规划路线</div>
    </div>
  </div>
</div>

<!-- Loading / Toast -->
<div class="loading-overlay" id="loading"><div class="loading-spinner"><div class="loading-spinner-icon">⏳</div><div class="loading-spinner-text" id="loadingText">计算中...</div></div></div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ================================================================
   Transit Go · 出行导航
   ================================================================ */
const $=id=>document.getElementById(id);

// ---- Config ----
const CFG={amapKey:'',tileStyle:'amap',searchTimer:null,cache:new Map()};
try{const s=JSON.parse(localStorage.getItem('tg_config')||'{}');if(s.amapKey)CFG.amapKey=s.amapKey;if(s.tileStyle)CFG.tileStyle=s.tileStyle;}catch(e){}
$('amapKeyInput').value=CFG.amapKey;

// ---- Map ----
const map=L.map('map',{zoomControl:false,attributionControl:true}).setView([39.9042,116.4074],13);
const tileLayers={
  amap:L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{maxZoom:18,subdomains:'1234',attribution:'&copy; 高德地图'}),
  osm:L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OSM'}),
  'carto-light':L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:19,attribution:'&copy; CARTO'}),
  'carto-dark':L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19,attribution:'&copy; CARTO'})
};
let curTile=tileLayers[CFG.tileStyle]||tileLayers.amap;curTile.addTo(map);

// ---- State ----
let fromPos=null,fromMarker=null,toPos=null,toMarker=null;
let routeLines=[],currentRoutes=[],activeIdx=0;
let activeInput=null; // 'from' | 'to'

// ---- Icons ----
const fromIcon=L.divIcon({className:'custom-div-icon',html:'<div class="marker-me"></div>',iconSize:[18,18],iconAnchor:[9,9]});
const toIcon=L.divIcon({className:'custom-div-icon',html:'<div class="marker-dest"></div>',iconSize:[18,18],iconAnchor:[9,9]});

// ---- Toast / Loading ----
let tt;
function toast(m,e){clearTimeout(tt);$('toast').textContent=m;$('toast').className='toast show'+(e?' error':'');tt=setTimeout(()=>$('toast').classList.remove('show'),2500);}
function ld(m){$('loadingText').textContent=m||'计算中...';$('loading').classList.add('show');}
function ul(){setTimeout(()=>$('loading').classList.remove('show'),200);}

// ==================== GPS ====================
function locateMe(s){
  if(!navigator.geolocation){if(!s)toast('设备不支持定位',1);return;}
  if(!s)toast('正在定位...');
  $('btnLocate').classList.add('locating');
  navigator.geolocation.getCurrentPosition(p=>{
    if(!p.coords.latitude||!p.coords.longitude){if(!s)toast('定位数据异常',1);return;}
    fromPos={lat:p.coords.latitude,lng:p.coords.longitude,name:''};
    updateFromMarker();
    map.setView([fromPos.lat,fromPos.lng],15,{animate:true});
    $('btnLocate').classList.remove('locating');
    if(!s)toast('定位成功 ✅');
    if(toPos)calcRoutes();
  },e=>{$('btnLocate').classList.remove('locating');if(!s)toast(e.code===1?'请允许定位权限':'定位失败',1);},
  {enableHighAccuracy:true,timeout:15000,maximumAge:60000});
}
function updateFromMarker(){
  if(!fromPos)return;
  if(fromMarker)map.removeLayer(fromMarker);
  fromMarker=L.marker([fromPos.lat,fromPos.lng],{icon:fromIcon,zIndexOffset:1000}).addTo(map);
}
function updateToMarker(){
  if(!toPos)return;
  if(toMarker)map.removeLayer(toMarker);
  toMarker=L.marker([toPos.lat,toPos.lng],{icon:toIcon,zIndexOffset:999}).addTo(map);
}

// ==================== Search ====================
function searchUrl(q){
  if(CFG.amapKey)return `https://restapi.amap.com/v3/assistant/inputtips?key=${CFG.amapKey}&keywords=${encodeURIComponent(q)}&output=json`;
  return `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=5&accept-language=zh&countrycodes=cn`;
}

function checkAmapError(d){
  if(d&&d.status==='0'){
    const msg=d.info||d.infocode||'';
    if(msg.includes('INVALID')){toast('高德Key无效，请检查设置',1);CFG.amapKey='';$('amapKeyInput').value='';localStorage.setItem('tg_config',JSON.stringify({amapKey:'',tileStyle:CFG.tileStyle}));}
    else toast('高德API错误：'+msg,1);
    return true;
  }
  return false;
}

function validCoord(lat,lng){return lat&&lng&&Math.abs(lat)>0.01&&Math.abs(lng)>0.01&&Math.abs(lat)<=90&&Math.abs(lng)<=180;}

$('inputFrom').addEventListener('focus',()=>{activeInput='from';$('inputFrom').select();});
$('inputTo').addEventListener('focus',()=>{activeInput='to';});
$('inputFrom').addEventListener('input',()=>handleInput('from'));
$('inputTo').addEventListener('input',()=>handleInput('to'));
$('inputFrom').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchCurrent();}});
$('inputTo').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchCurrent();}});

function getInp(){return activeInput==='from'?$('inputFrom'):$('inputTo');}
function getClr(){return activeInput==='from'?$('clearFrom'):$('clearTo');}

function handleInput(which){
  const inp=which==='from'?$('inputFrom'):$('inputTo');
  const clr=which==='from'?$('clearFrom'):$('clearTo');
  clr.classList.toggle('show',inp.value.trim().length>0);
  clearTimeout(CFG.searchTimer);
  const q=inp.value.trim();
  if(q.length<1){$('suggestions').classList.remove('show');return;}
  if(CFG.cache.has(q)){renderSuggestions(CFG.cache.get(q));return;}
  CFG.searchTimer=setTimeout(()=>{
    fetch(searchUrl(q)).then(r=>r.json()).then(d=>{CFG.cache.set(q,d);if(inp.value.trim()===q)renderSuggestions(d);}).catch(()=>{});
  },300);
}

function searchCurrent(){
  const inp=getInp(),q=inp.value.trim();if(!q)return;
  $('suggestions').classList.remove('show');inp.blur();ld('搜索中...');
  fetch(searchUrl(q)).then(r=>r.json()).then(d=>{
    ul();if(checkAmapError(d))return;
    if(!d){toast('未找到',1);return;}
    let lat,lng,name,district;
    if(d.tips){
      const t=d.tips.filter(t=>t.location&&t.location!=='0,0')[0];
      if(!t){toast('未找到',1);return;}
      [lng,lat]=t.location.split(',').map(Number);
      name=t.name;district=t.district||'';
    }else{
      if(!d.length){toast('未找到',1);return;}
      lat=+d[0].lat;lng=+d[0].lon;
      name=d[0].display_name.split(',')[0];district='';
    }
    if(!validCoord(lat,lng)){toast('坐标异常，请重试或检查高德Key类型（需Web服务）',1);return;}
    setPos(name,lat,lng,district);
  }).catch(()=>{ul();toast('搜索失败，检查网络',1);});
}

function renderSuggestions(data){
  const s=$('suggestions');
  if(checkAmapError(data)){s.classList.remove('show');return;}
  const empty=!data||(Array.isArray(data)&&!data.length)||(data.tips&&!data.tips.filter(t=>t.location&&t.location!=='0,0').length);
  if(empty){s.innerHTML='<div class="sug-item" style="color:var(--g400);justify-content:center">未找到结果</div>';s.classList.add('show');return;}
  let items='';
  if(data.tips){
    items=data.tips.filter(t=>t.location&&t.location!=='0,0').map((t,i)=>`<div class="sug-item" data-idx="${i}"><span class="sug-icon">${t.tipType===5?'🚉':t.tipType===4?'🚌':'📍'}</span><div class="sug-text"><div class="sug-name">${esc(t.name)}</div><div class="sug-addr">${esc(t.district||'')}${esc(t.address||'')}</div></div></div>`).join('');
  }else{
    items=data.map((t,i)=>`<div class="sug-item" data-idx="${i}"><span class="sug-icon">📍</span><div class="sug-text"><div class="sug-name">${esc(t.display_name.split(',')[0])}</div><div class="sug-addr">${esc(t.display_name.split(',').slice(1).join(',').trim())}</div></div></div>`).join('');
  }
  s.innerHTML=items;s.classList.add('show');
}

function setPos(name,lat,lng,district){
  if(!lat||!lng){toast('坐标无效，请重试',1);return;}

// ==================== Routes ====================
async function calcRoutes(){
  if(!fromPos||!toPos)return;
  clearMapRoutes();ld('计算路线中...');
  $('routeEmpty').style.display='none';$('routeContent').style.display='block';$('routeContent').innerHTML='';
  currentRoutes=[];

  if(CFG.amapKey){
    const or=`${fromPos.lng},${fromPos.lat}`,de=`${toPos.lng},${toPos.lat}`;
    const[tr,wk,dr]=await Promise.allSettled([
      fetchAmap('direction/transit/integrated',{origin:or,destination:de,city:fromPos.district||'全国',cityd:toPos.district||'全国'}),
      fetchAmap('direction/walking',{origin:or,destination:de}),
      fetchAmap('direction/driving',{origin:or,destination:de})
    ]);
    if(tr.status==='fulfilled'&&tr.value)currentRoutes.push(...tr.value);
    else if(tr.status==='fulfilled'&&!tr.value){
      const near=await findNearestTransit(toPos);
      if(near){
        ld('自动接驳最近站点...');
        const tr2=await fetchAmap('direction/transit/integrated',{origin:or,destination:`${near.lng},${near.lat}`,city:fromPos.district||'全国',cityd:''});
        if(tr2){tr2.forEach(r=>{r.steps.push({type:'walk',instruction:`步行到 ${esc(toPos.name)}`,distance:Math.round(near.dist||200),duration:Math.round((near.dist||200)/80*60)});r.summary.distance+=Math.round(near.dist||200);r.summary.duration+=Math.round((near.dist||200)/80*60);r.label+=' + 🚶接驳';});currentRoutes.push(...tr2);}
      }
    }
    if(wk.status==='fulfilled'&&wk.value)currentRoutes.push(wk.value);
    if(dr.status==='fulfilled'&&dr.value)currentRoutes.push(dr.value);
  }else{
    try{
      const r=await fetch(`https://router.project-osrm.org/route/v1/foot/${fromPos.lng},${fromPos.lat};${toPos.lng},${toPos.lat}?overview=full&steps=true&alternatives=true&geometries=geojson`);
      const d=await r.json();
      if(d.code==='Ok')for(let i=0;i<Math.min(d.routes.length,2);i++){
        const rt=d.routes[i],steps=[];
        rt.legs.forEach(l=>l.steps.forEach(s=>steps.push({type:'walk',instruction:s.maneuver.type==='depart'?'从起点出发':s.maneuver.type==='arrive'?'到达目的地':'步行',distance:Math.round(s.distance),duration:Math.round(s.duration)})));
        currentRoutes.push({type:'walking',summary:{distance:Math.round(rt.distance),duration:Math.round(rt.duration)},coords:rt.geometry.coordinates.map(c=>[c[1],c[0]]),steps,label:`🚶 步行 ${fmtDist(rt.distance)} · ${fmtDur(rt.duration)}`});
      }
    }catch(e){}
  }
  ul();
  if(!currentRoutes.length){$('routeContent').innerHTML='<div style="text-align:center;padding:30px;color:var(--g400)">😔 未找到路线</div>';return;}
  activeIdx=0;renderTabs();showRoute(0);openCard();$('btnSaveRoute').style.display='flex';
}

async function findNearestTransit(pos){
  try{
    const r=await fetch(`https://restapi.amap.com/v3/place/around?key=${CFG.amapKey}&location=${pos.lng},${pos.lat}&keywords=地铁站|公交站&radius=3000&output=json&sortrule=distance`);
    const d=await r.json();
    if(d.status!=='1'||!d.pois||!d.pois.length)return null;
    const p=d.pois[0];const[lng,lat]=p.location.split(',').map(Number);
    return{lat,lng,dist:+p.distance,station:p.name};
  }catch(e){return null;}
}

async function fetchAmap(path,params){
  params.key=CFG.amapKey;params.output='json';
  const r=await fetch(`https://restapi.amap.com/v3/${path}?${new URLSearchParams(params)}`);
  const d=await r.json();
  if(d.status!=='1'||d.errcode)return null;
  return parseAmap(d,path);
}

function parseAmap(data,path){
  if(path.includes('transit')){
    return(data.route?.transits||[]).map(t=>{
      const steps=[];let mn=0,bn=0;let allCoords=[];
      t.segments.forEach(seg=>{
        if(seg.walking){const w=seg.walking;steps.push({type:'walk',instruction:'步行',distance:+w.distance,duration:+w.duration});if(w.steps)w.steps.forEach(s=>{if(s.polyline)allCoords.push(...decodePoly(s.polyline));});}
        if(seg.bus&&seg.bus.buslines)seg.bus.buslines.forEach(bl=>{
          const tp=(bl.type||'').includes('地铁')?'metro':'bus';if(tp==='metro')mn++;else bn++;
          const dLoc=(bl.departure_stop||{}).location||'';
          const aLoc=(bl.arrival_stop||{}).location||'';
          const dLatLng=dLoc?dLoc.split(',').map(Number).reverse():null;
          const aLatLng=aLoc?aLoc.split(',').map(Number).reverse():null;
          steps.push({type:tp,line:bl.name,departure:(bl.departure_stop||{}).name||'',arrival:(bl.arrival_stop||{}).name||'',stops:+(bl.via_num||0),distance:+bl.distance,duration:+bl.duration,depLoc:dLatLng,arrLoc:aLatLng});
          if(bl.polyline)allCoords.push(...decodePoly(bl.polyline));
        });
      });
      const parts=[];if(mn)parts.push(`🚇${mn}次`);if(bn)parts.push(`🚌${bn}次`);
      return{type:'transit',summary:{distance:+t.distance,duration:+t.duration,metroCount:mn,busCount:bn},coords:allCoords,steps,label:`${parts.join('·')} · ${fmtDur(+t.duration)}`};
    });
  }
  if(path.includes('walking')||path.includes('driving')){
    const rt=data.route?.paths?.[0];if(!rt)return null;
    const steps=(rt.steps||[]).map(s=>({type:'walk',instruction:s.instruction||'步行',distance:+s.distance,duration:+s.duration}));
    let coords=[];(rt.steps||[]).forEach(s=>{if(s.polyline)coords.push(...decodePoly(s.polyline));});
    const ico=path.includes('driving')?'🚗':'🚶',lbl=path.includes('driving')?'驾车':'步行';
    return{type:'walking',summary:{distance:+rt.distance,duration:+rt.duration},coords,steps,label:`${ico} ${lbl} ${fmtDist(+rt.distance)} · ${fmtDur(+rt.duration)}`};
  }
  return null;
}

function decodePoly(e){if(!e)return[];const c=[];let i=0,la=0,ln=0;while(i<e.length){let b,sh=0,r=0;do{b=e.charCodeAt(i++)-63;r|=(b&0x1f)<<sh;sh+=5}while(b>=0x20);la+=(r&1?~(r>>1):(r>>1));sh=0;r=0;do{b=e.charCodeAt(i++)-63;r|=(b&0x1f)<<sh;sh+=5}while(b>=0x20);ln+=(r&1?~(r>>1):(r>>1));c.push([la/1e6,ln/1e6]);}return c;}

// ==================== Display ====================
function renderTabs(){
  $('routeTitle').textContent=`${esc(fromPos?.name||'起点')} → ${esc(toPos?.name||'终点')}`;
  $('routeContent').innerHTML=`<div class="route-tabs">${currentRoutes.map((r,i)=>`<button class="route-tab${i===activeIdx?' active':''}" data-idx="${i}">${esc(r.label)}</button>`).join('')}</div><div id="stepContainer"></div>`;
  $('routeContent').querySelectorAll('.route-tab').forEach(t=>t.addEventListener('click',()=>{activeIdx=+t.dataset.idx;renderTabs();showRoute(activeIdx);}));
}

function showRoute(idx){
  const r=currentRoutes[idx];if(!r)return;
  clearMapRoutes();
  if(r.coords&&r.coords.length>1){const cl=r.type==='walking'?'#E89520':'#396AFC';const ln=L.polyline(r.coords,{color:cl,weight:5,opacity:.7,dashArray:r.type==='walking'?'10 6':null}).addTo(map);routeLines.push(ln);map.fitBounds(L.latLngBounds(r.coords),{padding:[50,50],maxZoom:15,animate:true});}

  // Add station markers for transit routes
  if(r.type==='transit'){
    r.steps.forEach(s=>{
      if((s.type==='metro'||s.type==='bus')&&s.depLoc){
        const m=L.marker(s.depLoc,{
          icon:L.divIcon({className:'custom-div-icon',html:`<div style="width:10px;height:10px;border-radius:50%;background:#fff;border:2.5px solid ${s.type==='metro'?'var(--red)':'var(--green)'};box-shadow:0 1px 4px rgba(0,0,0,.2)"></div>`,iconSize:[10,10],iconAnchor:[5,5]}),
          zIndexOffset:800
        }).addTo(map);
        m.bindTooltip(`<b>上车</b><br>${esc(s.departure)}<br>${esc(s.line)}`,{direction:'top',offset:[0,-8]});
        routeLines.push(m);
      }
      if((s.type==='metro'||s.type==='bus')&&s.arrLoc){
        const m=L.marker(s.arrLoc,{
          icon:L.divIcon({className:'custom-div-icon',html:`<div style="width:10px;height:10px;border-radius:50%;background:#fff;border:2.5px solid ${s.type==='metro'?'var(--red)':'var(--green)'};box-shadow:0 1px 4px rgba(0,0,0,.2)"></div>`,iconSize:[10,10],iconAnchor:[5,5]}),
          zIndexOffset:800
        }).addTo(map);
        m.bindTooltip(`<b>下车</b><br>${esc(s.arrival)}<br>${esc(s.line)}`,{direction:'top',offset:[0,-8]});
        routeLines.push(m);
      }
    });
  }
  const sc=$('stepContainer');if(!sc)return;
  const s=r.summary;
  let si=[{val:fmtDur(s.duration),label:'预计时间'},{val:fmtDist(s.distance),label:'总距离'}];
  if(r.type==='transit'){if(s.metroCount)si.push({val:s.metroCount+' 条',label:'地铁'});if(s.busCount)si.push({val:s.busCount+' 条',label:'公交'});}

  let fh='';
  if(r.type==='transit'){
    const segs=[];r.steps.forEach(st=>{const l=st.type==='metro'?`🚇${esc(st.line||'')}`:st.type==='bus'?`🚌${esc(st.line||'')}`:'🚶';segs.push({type:st.type,label:l});});
    fh='<div class="flow-bar"><span style="font-size:12px;font-weight:700">起</span>';
    segs.forEach(sg=>{const cl=sg.type==='metro'?'metro':sg.type==='bus'?'bus':'walk';fh+=`<div class="flow-line ${cl}"></div><span class="flow-label">${sg.label}</span><div class="flow-line ${cl}"></div>`;});
    fh+='<span style="font-size:12px;font-weight:700">终</span></div>';
  }

  let h=`<div class="route-summary">${si.map(m=>`<div class="route-summary-item"><div class="route-summary-val">${m.val}</div><div class="route-summary-label">${m.label}</div></div>`).join('')}</div>${fh}`;
  let sn=0,buf=[];
  const flush=()=>{if(!buf.length)return;if(buf.length===1)h+=renderStep(++sn,buf[0]);else{const td=buf.reduce((s,st)=>s+(st.distance||0),0);h+=renderStep(++sn,{type:'walk',instruction:'沿路步行',distance:td});}buf=[];};
  r.steps.forEach(st=>{if(st.type==='walk')buf.push(st);else{flush();h+=renderStep(++sn,st);}});
  flush();
  if(!CFG.amapKey&&currentRoutes.every(x=>x.type==='walking')){h+=`<div style="margin-top:20px;padding:16px;background:#FFF9E6;border-radius:12px;font-size:13px;color:#8B6914;line-height:1.7">💡 <b>提示：</b>当前仅显示步行路线。<br>右侧 ◀ 点击打开设置，填入高德 Key 即可查看公交地铁换乘。<br><a href="https://lbs.amap.com/" target="_blank" style="color:var(--blue)">免费获取 Key →</a></div>`;}
  sc.innerHTML=h;
}

function renderStep(num,s){
  const cfg={metro:['metro','🚇'],bus:['bus','🚌'],walk:['walk','🚶'],transfer:['transfer','🔄']};
  const[cls,icon]=cfg[s.type]||['walk','🚶'];
  let title='',sub='';
  if(s.type==='metro'||s.type==='bus'){
    const tp=s.type==='metro'?'地铁':'公交';
    title=s.line?`<b>${esc(s.line)}</b> <span style="font-size:12px;color:var(--g400);font-weight:400">${tp}</span>`:`乘坐${tp}`;
    if(s.departure&&s.arrival){
      sub=`<div class="step-stations"><div style="text-align:center"><span style="font-size:10px;color:var(--blue);font-weight:700">上车</span><br><span class="step-station">${esc(s.departure)}</span></div><span class="step-arrow">→</span><div style="text-align:center"><span style="font-size:10px;color:var(--red);font-weight:700">下车</span><br><span class="step-station">${esc(s.arrival)}</span></div><span class="step-stops">${s.stops>0?'坐 '+s.stops+' 站':''}</span></div>`;
    }
    sub+=`<div class="step-info">${fmtDist(s.distance)} · ${fmtDur(s.duration)}</div>`;
  }else{
    title=s.instruction||'步行';
    sub=`<div class="step-info">${s.distance?fmtDist(s.distance)+' · ':''}${s.duration?fmtDur(s.duration):''}</div>`;
  }
  return`<div class="step"><div class="step-num">${num}</div><div class="step-icon-wrap ${cls}">${icon}</div><div class="step-content"><div class="step-title">${title}</div>${sub}</div></div>`;
}

function clearMapRoutes(){routeLines.forEach(l=>map.removeLayer(l));routeLines=[];}

// ==================== Route Card (bottom-based, no transform conflict) ====================
const cardEl=$('routeCard');
const cardPeek=56; // px visible when collapsed
let cardHeight=0, cardBottom=-(window.innerHeight-cardPeek); // start collapsed
cardEl.style.bottom=cardBottom+'px';
cardEl.style.maxHeight='70vh';

function updateCardSize(){
  cardHeight=cardEl.offsetHeight||window.innerHeight*.45;
  // Keep current ratio when resizing
  const ratio=(cardBottom+cardHeight)/cardHeight;
  setCardBottom(cardBottom);
}
function setCardBottom(y){
  cardBottom=Math.max(-cardHeight+cardPeek,Math.min(y,0));
  cardEl.style.bottom=Math.round(cardBottom)+'px';
}
function openCard(){setCardBottom(0);}
function closeCard(){setCardBottom(-cardHeight+cardPeek);}

$('routeHandle').addEventListener('pointerdown',e=>{
  e.preventDefault();cardEl.setPointerCapture(e.pointerId);
  cardEl.style.transition='none';
  const startY=e.clientY,startB=cardBottom;
  function mv(ev){
    setCardBottom(startB+startY-ev.clientY);
  }
  function up(){
    cardEl.style.transition='bottom .35s cubic-bezier(.25,.8,.25,1)';
    // Snap: near top → open; near bottom → peek; middle → stay
    if(cardBottom>-cardHeight*.2)openCard();
    else if(cardBottom<-cardHeight*.8)closeCard();
    cardEl.removeEventListener('pointermove',mv);
    cardEl.removeEventListener('pointerup',up);
    cardEl.removeEventListener('pointercancel',up);
  }
  cardEl.addEventListener('pointermove',mv);
  cardEl.addEventListener('pointerup',up);
  cardEl.addEventListener('pointercancel',up);
});

// Tap header to toggle
$('routeHandle').addEventListener('click',e=>{
  if(cardBottom>-cardHeight*.5)closeCard();else openCard();
});

// Update on resize
window.addEventListener('resize',updateCardSize);
// Delay initial size check
setTimeout(updateCardSize,100);

  const fs=getFavs(),el=$('favList');
  if(!fs.length){el.innerHTML='<div class="fav-empty">📭<br>还没有收藏路线<br>规划路线后点击 ⭐ 收藏</div>';return;}
  el.innerHTML=fs.reverse().map((f,i)=>{const d=new Date(f.date);return`<div class="fav-item" data-idx="${fs.length-1-i}"><div class="fav-item-route"><div class="fav-item-from">🟢 ${esc(f.fromName||'GPS定位')}</div><div class="fav-item-to">🔴 ${esc(f.toName)}</div><div class="fav-item-date">${d.toLocaleDateString()} ${d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div></div><button class="fav-item-del" data-del="${fs.length-1-i}">✕</button></div>`;}).join('');
  el.querySelectorAll('.fav-item').forEach(item=>{item.addEventListener('click',e=>{if(e.target.closest('.fav-item-del'))return;const idx=+item.dataset.idx,f=fs.reverse()[idx];$('inputFrom').value='';$('inputTo').value=f.toName;$('clearTo').classList.add('show');if(fromMarker)map.removeLayer(fromMarker);fromPos={lat:f.fromLat,lng:f.fromLng,name:f.fromName};fromMarker=L.marker([fromPos.lat,fromPos.lng],{icon:fromIcon,zIndexOffset:1000}).addTo(map);setDest(f.toName,f.toLat,f.toLng,'');$('favOverlay').classList.remove('show');});});
  el.querySelectorAll('.fav-item-del').forEach(b=>{b.addEventListener('click',e=>{e.stopPropagation();const fs2=getFavs();fs2.splice(+b.dataset.del,1);saveFavs(fs2);renderFavs();});});
}
function setDest(name,lat,lng,district){
  toPos={lat,lng,name,district:district||''};$('inputTo').value=name;$('clearTo').classList.add('show');
  if(toMarker)map.removeLayer(toMarker);
  toMarker=L.marker([lat,lng],{icon:toIcon,zIndexOffset:999}).addTo(map);
  fitBoth();if(!fromPos){toast('正在定位...');locateMe(true);return;}calcRoutes();
}

$('btnFav').addEventListener('click',()=>{renderFavs();$('favOverlay').classList.add('show');});
$('favClose').addEventListener('click',()=>$('favOverlay').classList.remove('show'));
$('favOverlay').addEventListener('click',e=>{if(e.target===$('favOverlay'))$('favOverlay').classList.remove('show');});
$('btnSaveRoute').addEventListener('click',()=>{
  if(!fromPos||!toPos)return;
  const fs=getFavs();fs.push({fromName:fromPos.name,fromLat:fromPos.lat,fromLng:fromPos.lng,toName:toPos.name,toLat:toPos.lat,toLng:toPos.lng,date:Date.now()});
  saveFavs(fs);toast('已收藏 ⭐');
});

// ==================== Buttons ====================
$('btnLocate').addEventListener('click',()=>locateMe());
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('suggestions').classList.remove('show');$('inputFrom').blur();$('inputTo').blur();}});
map.on('click',()=>{$('suggestions').classList.remove('show');$('inputFrom').blur();$('inputTo').blur();});

// ==================== Utils ====================
function fmtDist(m){return m<1000?Math.round(m)+'米':(m/1000).toFixed(1)+'公里';}
function fmtDur(s){if(s<60)return Math.round(s)+'秒';if(s<3600)return Math.round(s/60)+'分钟';const h=Math.floor(s/3600),m=Math.round((s%3600)/60);return h+'小时'+(m?m+'分钟':'');}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

// ==================== Init ====================
locateMe(true);
window.addEventListener('resize',()=>map.invalidateSize());
</script>
</body>
</html>
