<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#4A90D9">
<title>Transit Go · 出行导航</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#4A90D9;--primary-dark:#3A7BC8;--danger:#E74C3C;
  --bg:#FFFFFF;--bg2:#F5F7FA;--text:#1A1A2E;--text2:#666;
  --border:#E0E4E8;--radius:14px;--radius-sm:10px;--shadow:0 2px 16px rgba(0,0,0,.08);
  --metro:#E74C3C;--bus:#2ECC71;--walk:#F39C12;--transfer:#9B59B6;
  --sheet-height:40vh;
  --safe-bottom:env(safe-area-inset-bottom,16px);
}
html,body{height:100%;width:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:15px;color:var(--text);background:var(--bg);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}

#map{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
.leaflet-control-zoom{display:none}
.leaflet-control-attribution{font-size:9px!important;opacity:.6;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(255,255,255,.7)!important;padding:2px 6px!important;border-radius:4px!important}

.topbar{position:fixed;top:0;left:0;right:0;z-index:100;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top,12px))}
.search-box{display:flex;align-items:center;background:var(--bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:2px;gap:0}
.search-input{flex:1;border:none;outline:none;padding:12px 14px;font-size:16px;background:transparent;color:var(--text);min-width:0;border-radius:var(--radius) 0 0 var(--radius)}
.search-input::placeholder{color:#B0B8C1}
.btn-icon{width:44px;height:44px;border:none;background:transparent;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--primary);font-size:20px;flex-shrink:0;transition:background .15s}
.btn-icon:active{background:var(--bg2)}
.btn-icon.locating{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.search-clear{display:none;color:var(--text2)}
.search-clear.show{display:flex}

.suggestions{position:fixed;top:80px;left:14px;right:14px;z-index:110;background:var(--bg);border-radius:var(--radius);box-shadow:0 4px 24px rgba(0,0,0,.12);max-height:320px;overflow-y:auto;display:none}
.suggestions.show{display:block}
.sug-item{padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .1s}
.sug-item:last-child{border-bottom:none}
.sug-item:active,.sug-item:hover{background:var(--bg2)}
.sug-icon{font-size:18px;flex-shrink:0;width:28px;text-align:center}
.sug-text{flex:1;min-width:0}
.sug-name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug-addr{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

.action-bar{position:fixed;top:140px;right:14px;z-index:100;display:flex;flex-direction:column;gap:8px}
.btn-action{width:44px;height:44px;border-radius:50%;border:none;background:var(--bg);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--text);transition:all .15s}
.btn-action:active{background:var(--bg2);transform:scale(.95)}
.btn-action.danger{background:var(--danger);color:#fff}

.sheet{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.1);transition:transform .35s cubic-bezier(.4,0,.2,1),height .35s cubic-bezier(.4,0,.2,1);transform:translateY(calc(100% - 52px));height:var(--sheet-height);display:flex;flex-direction:column}
.sheet.expanded{transform:translateY(0);height:68vh}
.sheet.collapsed{transform:translateY(calc(100% - 52px))}
.sheet-handle{display:flex;justify-content:center;padding:12px 0 8px;cursor:pointer;flex-shrink:0}
.sheet-handle-bar{width:36px;height:4px;border-radius:2px;background:#D0D5DD}
.sheet-header{padding:4px 20px 12px;flex-shrink:0;border-bottom:1px solid var(--border)}
.sheet-title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px}
.sheet-meta{font-size:13px;color:var(--text2);margin-top:4px}
.sheet-body{flex:1;overflow-y:auto;padding:12px 20px 20px;-webkit-overflow-scrolling:touch;padding-bottom:calc(20px + var(--safe-bottom))}
.sheet-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text2);text-align:center;padding:20px}
.sheet-empty-icon{font-size:48px;margin-bottom:12px;opacity:.6}
.sheet-empty-text{font-size:14px;line-height:1.6}

.route-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.route-tab{padding:8px 16px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;color:var(--text);white-space:nowrap}
.route-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}

.step{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.step:last-child{border-bottom:none}
.step-icon-wrap{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
.step-icon-wrap.metro{background:#FDEDEC;color:var(--metro)}
.step-icon-wrap.bus{background:#E8F8F0;color:var(--bus)}
.step-icon-wrap.walk{background:#FEF5E7;color:var(--walk)}
.step-icon-wrap.transfer{background:#F4ECF7;color:var(--transfer)}
.step-content{flex:1;min-width:0;padding-top:2px}
.step-title{font-size:14px;font-weight:600;line-height:1.4}
.step-detail{font-size:12px;color:var(--text2);margin-top:3px;line-height:1.5}
.step-line-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;margin-left:6px;vertical-align:middle}
.step-line-badge.metro{background:var(--metro);color:#fff}
.step-line-badge.bus{background:var(--bus);color:#fff}
.step-line-badge.walk{background:var(--walk);color:#fff}

.route-summary{display:flex;gap:12px;padding:14px 16px;background:var(--bg2);border-radius:var(--radius-sm);margin-bottom:14px;flex-wrap:wrap}
.route-summary-item{display:flex;flex-direction:column;align-items:center;min-width:60px}
.route-summary-val{font-size:18px;font-weight:700;color:var(--primary)}
.route-summary-label{font-size:11px;color:var(--text2);margin-top:2px}

.loading-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.3);display:none;align-items:center;justify-content:center}
.loading-overlay.show{display:flex}
.loading-spinner{background:var(--bg);border-radius:var(--radius);padding:24px 32px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.loading-spinner-icon{font-size:36px;animation:spin .8s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-spinner-text{font-size:14px;color:var(--text2)}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:300;background:#1A1A2E;color:#fff;padding:12px 22px;border-radius:24px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap}
.toast.show{opacity:1}
.toast.error{background:var(--danger)}

.modal-overlay{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:80vh;overflow-y:auto;padding:8px 20px 20px;padding-bottom:calc(20px + var(--safe-bottom))}
.modal-title{font-size:18px;font-weight:700;text-align:center;padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:16px}
.modal-section{margin-bottom:20px}
.modal-label{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.modal-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;outline:none;transition:border-color .2s}
.modal-input:focus{border-color:var(--primary)}
.modal-hint{font-size:12px;color:var(--text2);margin-top:6px;line-height:1.5}
.modal-hint a{color:var(--primary)}
.modal-btn{width:100%;padding:14px;border:none;border-radius:var(--radius-sm);font-size:16px;font-weight:600;cursor:pointer;transition:all .15s}
.modal-btn.primary{background:var(--primary);color:#fff}
.modal-btn.primary:active{background:var(--primary-dark)}
.modal-btn.secondary{background:var(--bg2);color:var(--text);margin-top:8px}

.marker-me{width:22px;height:22px;background:var(--primary);border:3px solid #fff;border-radius:50%;box-shadow:0 2px 8px rgba(74,144,217,.4);position:relative}
.marker-me::after{content:'';position:absolute;top:50%;left:50%;width:40px;height:40px;background:rgba(74,144,217,.12);border-radius:50%;transform:translate(-50%,-50%);animation:pulse-ring 2s ease-out infinite}
@keyframes pulse-ring{0%{transform:translate(-50%,-50%) scale(.5);opacity:1}100%{transform:translate(-50%,-50%) scale(2);opacity:0}}
.marker-dest{width:32px;height:42px;position:relative}
.marker-dest::before{content:'📌';font-size:28px;position:absolute;top:0;left:50%;transform:translateX(-50%);filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
.custom-div-icon{border:none!important;background:none!important}

@media(min-width:768px){.topbar{max-width:500px;left:50%;transform:translateX(-50%);padding-left:0;padding-right:0}.suggestions{max-width:472px;left:50%;transform:translateX(-50%)}}
@media(min-width:1024px){.sheet{left:50%;transform:translate(-50%,calc(100% - 52px));max-width:500px}.sheet.expanded{transform:translate(-50%,0)}}
</style>
</head>
<body>
<div id="map"></div>
<div class="topbar">
  <div class="search-box">
    <input type="text" class="search-input" id="searchInput" placeholder="搜索目的地、地标、地址..." autocomplete="off" enterkeyhint="search">
    <button class="btn-icon search-clear" id="searchClear" title="清除">✕</button>
    <button class="btn-icon" id="searchBtn" title="搜索">🔍</button>
  </div>
</div>
<div class="suggestions" id="suggestions"></div>
<div class="action-bar">
  <button class="btn-action" id="btnLocate" title="我的位置">📍</button>
  <button class="btn-action" id="btnSettings" title="设置">⚙️</button>
  <button class="btn-action danger" id="btnClear" title="清除路线" style="display:none">✕</button>
</div>
<div class="sheet collapsed" id="sheet">
  <div class="sheet-handle" id="sheetHandle"><div class="sheet-handle-bar"></div></div>
  <div class="sheet-header" id="sheetHeader">
    <div class="sheet-title" id="sheetTitle">🗺️ 想去哪里？</div>
    <div class="sheet-meta" id="sheetMeta"></div>
  </div>
  <div class="sheet-body" id="sheetBody">
    <div class="sheet-empty" id="sheetEmpty">
      <div class="sheet-empty-icon">🚇</div>
      <div class="sheet-empty-text">在上方搜索目的地<br>自动规划公交地铁换乘路线</div>
    </div>
    <div id="routeContent" style="display:none"></div>
  </div>
</div>
<div class="loading-overlay" id="loading">
  <div class="loading-spinner">
    <div class="loading-spinner-icon">⏳</div>
    <div class="loading-spinner-text" id="loadingText">计算路线中...</div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <div class="modal-title">⚙️ 设置</div>
    <div class="modal-section">
      <div class="modal-label">高德地图 API Key（Web服务）</div>
      <input type="text" class="modal-input" id="amapKeyInput" placeholder="输入你的高德 Key...">
      <div class="modal-hint">
        用于地点搜索 + 公交/地铁/步行路线规划。<br>
        👉 打开 <a href="https://lbs.amap.com/" target="_blank">lbs.amap.com</a> 注册 → 创建应用 → 添加 Key。<br>
        <b>服务平台</b> 选「Web服务」，完成后将 Key 粘贴到上方。<br>
        不填也可使用高德地图浏览 + 步行导航（OSRM）。
      </div>
    </div>
    <div class="modal-section">
      <div class="modal-label">地图风格</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap" id="tileOptions">
        <button class="route-tab active" data-tile="amap">高德地图</button>
        <button class="route-tab" data-tile="osm">OSM标准</button>
        <button class="route-tab" data-tile="carto-light">浅色地图</button>
        <button class="route-tab" data-tile="carto-dark">暗色地图</button>
      </div>
    </div>
    <button class="modal-btn primary" id="saveSettings">保存设置</button>
    <button class="modal-btn secondary" id="closeSettings">取消</button>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ================================================================
   Transit Go · 出行导航 — 高德地图版
   域名: guyu476.github.io/transit-go
   ================================================================ */

const $ = id => document.getElementById(id);

// ---- Config ----
const CONFIG = {
  amapKey: '',
  tileStyle: 'amap',
  searchTimer: null,
  searchCache: new Map()
};
try {
  const s = JSON.parse(localStorage.getItem('transitgo_config') || '{}');
  if (s.amapKey) CONFIG.amapKey = s.amapKey;
  if (s.tileStyle) CONFIG.tileStyle = s.tileStyle;
} catch(e) {}
$('amapKeyInput').value = CONFIG.amapKey;

// ---- Map ----
const map = L.map('map', { zoomControl: false, attributionControl: true }).setView([39.9042, 116.4074], 13);

const tileLayers = {
  'amap': L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
    maxZoom: 18, subdomains: '1234',
    attribution: '&copy; <a href="https://www.amap.com/">高德地图</a>'
  }),
  'osm': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }),
  'carto-light': L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>'
  }),
  'carto-dark': L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>'
  })
};
let currentTile = tileLayers[CONFIG.tileStyle] || tileLayers['amap'];
currentTile.addTo(map);

// ---- State ----
let myPos = null, myMarker = null;
let destPos = null, destMarker = null;
let routeLines = [], currentRoutes = [], activeRouteIdx = 0;

// ---- Icons ----
const meIcon = L.divIcon({ className: 'custom-div-icon', html: '<div class="marker-me"></div>', iconSize: [22,22], iconAnchor: [11,11] });
const destIcon = L.divIcon({ className: 'custom-div-icon', html: '<div class="marker-dest"></div>', iconSize: [32,42], iconAnchor: [16,42] });

// ---- Toast & Loading ----
let toastTimer;
function showToast(msg, err) {
  clearTimeout(toastTimer);
  $('toast').textContent = msg;
  $('toast').className = 'toast show' + (err ? ' error' : '');
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2500);
}
function loading(msg) { $('loadingText').textContent = msg || '计算中...'; $('loading').classList.add('show'); }
function loaded() { $('loading').classList.remove('show'); }

// ---- Geolocation ----
function locateMe(silent) {
  if (!navigator.geolocation) { if (!silent) showToast('设备不支持定位', true); return; }
  if (!silent) showToast('正在定位...');
  $('btnLocate').classList.add('locating');
  navigator.geolocation.getCurrentPosition(p => {
    myPos = { lat: p.coords.latitude, lng: p.coords.longitude };
    if (myMarker) map.removeLayer(myMarker);
    myMarker = L.marker([myPos.lat, myPos.lng], { icon: meIcon, zIndexOffset: 1000 }).addTo(map).bindPopup('<b>📍 我的位置</b>').openPopup();
    map.setView([myPos.lat, myPos.lng], 15, { animate: true });
    $('btnLocate').classList.remove('locating');
    if (!silent) showToast('定位成功 ✅');
    if (destPos) calcRoutes();
  }, e => {
    $('btnLocate').classList.remove('locating');
    if (!silent) showToast(e.code === 1 ? '请允许定位权限' : '定位失败，请检查GPS', true);
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
}

// ==================== Search ====================
// 高德 Input Tips API（有 Key 时） > Nominatim（无 Key 时）
function buildSearchUrl(q) {
  if (CONFIG.amapKey) {
    return `https://restapi.amap.com/v3/assistant/inputtips?key=${CONFIG.amapKey}&keywords=${encodeURIComponent(q)}&output=json`;
  }
  return `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=5&accept-language=zh&countrycodes=cn`;
}

$('searchInput').addEventListener('input', () => {
  const q = $('searchInput').value.trim();
  $('searchClear').classList.toggle('show', q.length > 0);
  clearTimeout(CONFIG.searchTimer);
  if (q.length < 1) { $('suggestions').classList.remove('show'); return; }
  if (CONFIG.searchCache.has(q)) { renderSuggestions(CONFIG.searchCache.get(q)); return; }
  CONFIG.searchTimer = setTimeout(() => {
    fetch(buildSearchUrl(q))
      .then(r => r.json())
      .then(d => { CONFIG.searchCache.set(q, d); if ($('searchInput').value.trim() === q) renderSuggestions(d); })
      .catch(() => {});
  }, 350);
});

$('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); const q = $('searchInput').value.trim(); if (q) searchAndGo(q); }
});
$('searchClear').addEventListener('click', () => { $('searchInput').value = ''; $('searchClear').classList.remove('show'); $('suggestions').classList.remove('show'); });

function renderSuggestions(data) {
  const s = $('suggestions');
  if (!data || (Array.isArray(data) && data.length === 0) || (data.tips && data.tips.length === 0)) {
    s.innerHTML = '<div class="sug-item" style="color:var(--text2);justify-content:center">未找到结果</div>';
    s.classList.add('show'); return;
  }

  // 高德 Input Tips 格式
  if (data.tips) {
    s.innerHTML = data.tips.filter(t => t.location && t.location !== '0,0').map((t, i) => `
      <div class="sug-item" data-idx="${i}">
        <span class="sug-icon">${t.tipType === 5 ? '🚉' : t.tipType === 4 ? '🚌' : '📍'}</span>
        <div class="sug-text">
          <div class="sug-name">${esc(t.name)}</div>
          <div class="sug-addr">${esc(t.district || '')}${esc(t.address || '')}</div>
        </div>
      </div>`).join('');
  } else {
    // Nominatim 格式
    s.innerHTML = data.map((item, i) => `
      <div class="sug-item" data-idx="${i}">
        <span class="sug-icon">📍</span>
        <div class="sug-text">
          <div class="sug-name">${esc(item.display_name.split(',')[0])}</div>
          <div class="sug-addr">${esc(item.display_name.split(',').slice(1).join(',').trim())}</div>
        </div>
      </div>`).join('');
  }
  s.classList.add('show');
}

$('suggestions').addEventListener('click', e => {
  const item = e.target.closest('.sug-item'); if (!item) return;
  const idx = +item.dataset.idx;
  const q = $('searchInput').value.trim();
  const data = CONFIG.searchCache.get(q);
  if (!data) return;
  $('suggestions').classList.remove('show');
  if (data.tips) selectAmapTip(data.tips.filter(t => t.location && t.location !== '0,0')[idx]);
  else selectNominatim(data[idx]);
});

function searchAndGo(q) {
  $('suggestions').classList.remove('show');
  $('searchInput').blur();
  loading('搜索中...');
  fetch(buildSearchUrl(q)).then(r => r.json()).then(d => {
    loaded();
    if (!d) { showToast('未找到该地点', true); return; }
    if (d.tips) {
      const tips = d.tips.filter(t => t.location && t.location !== '0,0');
      if (!tips.length) { showToast('未找到该地点', true); return; }
      selectAmapTip(tips[0]);
    } else {
      if (!d.length) { showToast('未找到该地点', true); return; }
      selectNominatim(d[0]);
    }
  }).catch(() => { loaded(); showToast('搜索失败，请检查网络', true); });
}

function selectAmapTip(tip) {
  const [lng, lat] = tip.location.split(',').map(Number);
  if (!lat || !lng) return;
  setDest(lat, lng, tip.name, tip.district);
}
function selectNominatim(item) {
  setDest(parseFloat(item.lat), parseFloat(item.lon), item.display_name.split(',')[0], '');
}

function setDest(lat, lng, name, district) {
  destPos = { lat, lng, name, district: district || '' };
  $('searchInput').value = name;
  $('searchClear').classList.add('show');
  if (destMarker) map.removeLayer(destMarker);
  destMarker = L.marker([lat, lng], { icon: destIcon, zIndexOffset: 999 }).addTo(map);
  if (myPos) map.fitBounds(L.latLngBounds([myPos.lat, myPos.lng], [lat, lng]), { padding: [60, 60], maxZoom: 15, animate: true });
  else map.setView([lat, lng], 15, { animate: true });
  $('btnClear').style.display = 'flex';
  $('sheetTitle').innerHTML = `📍 ${esc(name)}`;
  if (!myPos) { showToast('请先点击 📍 定位你的位置'); locateMe(true); return; }
  calcRoutes();
}

// ==================== Route Calculation ====================
async function calcRoutes() {
  if (!myPos || !destPos) return;
  clearMapRoutes();
  loading('计算路线中...');
  $('sheetEmpty').style.display = 'none';
  $('routeContent').style.display = 'block';
  $('routeContent').innerHTML = '';
  currentRoutes = [];

  const from = `${myPos.lng},${myPos.lat}`;
  const to = `${destPos.lng},${destPos.lat}`;

  if (CONFIG.amapKey) {
    // 高德：公交 + 步行 + 驾车
    const [transit, walk, drive] = await Promise.allSettled([
      fetchAmap('direction/transit/integrated', { origin: from, destination: to, city: getCity(myPos), cityd: getCity(destPos) }),
      fetchAmap('direction/walking', { origin: from, destination: to }),
      fetchAmap('direction/driving', { origin: from, destination: to })
    ]);
    if (transit.status === 'fulfilled' && transit.value) currentRoutes.push(...transit.value);
    if (walk.status === 'fulfilled' && walk.value) currentRoutes.push(walk.value);
    if (drive.status === 'fulfilled' && drive.value) currentRoutes.push(drive.value);
  } else {
    // 无 Key 时：OSRM 步行
    try {
      const r = await fetch(`https://router.project-osrm.org/route/v1/foot/${myPos.lng},${myPos.lat};${destPos.lng},${destPos.lat}?overview=full&steps=true&alternatives=true&geometries=geojson`);
      const d = await r.json();
      if (d.code === 'Ok') {
        for (let i = 0; i < Math.min(d.routes.length, 2); i++) {
          const rt = d.routes[i];
          const steps = [];
          rt.legs.forEach(leg => leg.steps.forEach(s => steps.push({
            type: 'walk', instruction: s.maneuver.type === 'depart' ? '从起点出发' : s.maneuver.type === 'arrive' ? '到达目的地' : s.maneuver.modifier || '继续前行',
            distance: Math.round(s.distance), duration: Math.round(s.duration)
          })));
          currentRoutes.push({
            type: 'walking',
            summary: { distance: Math.round(rt.distance), duration: Math.round(rt.duration) },
            coords: rt.geometry.coordinates.map(c => [c[1], c[0]]),
            steps,
            label: `🚶 步行 ${fmtDist(rt.distance)} · ${fmtDur(rt.duration)}`
          });
        }
      }
    } catch(e) {}
  }

  loaded();
  if (!currentRoutes.length) {
    $('routeContent').innerHTML = '<div class="sheet-empty" style="height:auto;padding:30px"><div class="sheet-empty-icon">😔</div><div class="sheet-empty-text">未找到路线<br>请尝试更近的目的地或检查网络</div></div>';
    return;
  }
  activeRouteIdx = 0;
  renderTabs();
  showRoute(0);
  $('sheet').classList.add('expanded');
  $('sheet').classList.remove('collapsed');
}

async function fetchAmap(path, params) {
  params.key = CONFIG.amapKey;
  params.output = 'json';
  const url = `https://restapi.amap.com/v3/${path}?${new URLSearchParams(params)}`;
  const r = await fetch(url);
  const d = await r.json();
  if (d.status !== '1' || d.errcode) return null;
  return parseAmapRoute(d, path);
}

function parseAmapRoute(data, path) {
  if (path.includes('transit')) {
    const transits = (data.route || {}).transits || [];
    return transits.map(t => {
      const steps = [];
      let metroN = 0, busN = 0;
      let allCoords = [];
      t.segments.forEach(seg => {
        if (seg.walking) {
          const w = seg.walking;
          steps.push({ type: 'walk', instruction: w.distance > 1000 ? `步行 ${fmtDist(+w.distance)}` : '步行', distance: +w.distance, duration: +w.duration });
          if (w.steps) w.steps.forEach(s => {
            if (s.polyline) allCoords.push(...decodeAmapPolyline(s.polyline));
          });
        }
        if (seg.bus && seg.bus.buslines) {
          seg.bus.buslines.forEach(bl => {
            const t = (bl.type || '').includes('地铁') ? 'metro' : 'bus';
            if (t === 'metro') metroN++; else busN++;
            steps.push({
              type: t,
              instruction: `乘坐 ${bl.name}`,
              line: bl.name,
              departure: (bl.departure_stop || {}).name || '',
              arrival: (bl.arrival_stop || {}).name || '',
              stops: bl.via_num || 0,
              distance: +bl.distance, duration: +bl.duration
            });
            if (bl.polyline) allCoords.push(...decodeAmapPolyline(bl.polyline));
          });
        }
      });
      const parts = [];
      if (metroN > 0) parts.push(`🚇 ${metroN}次地铁`);
      if (busN > 0) parts.push(`🚌 ${busN}次公交`);
      return {
        type: 'transit',
        summary: { distance: +t.distance, duration: +t.duration, metroCount: metroN, busCount: busN, walks: 0 },
        coords: allCoords, steps,
        label: `${parts.join(' · ')} · ${fmtDur(+t.duration)} · ¥${t.cost || '?'}`
      };
    });
  }
  if (path.includes('walking')) {
    const rt = (data.route || {}).paths ? data.route.paths[0] : null;
    if (!rt) return null;
    const steps = (rt.steps || []).map(s => ({
      type: 'walk',
      instruction: s.instruction || '步行',
      distance: +s.distance, duration: +s.duration
    }));
    let coords = [];
    (rt.steps || []).forEach(s => { if (s.polyline) coords.push(...decodeAmapPolyline(s.polyline)); });
    if (!coords.length && rt.steps) {
      coords = rt.steps.map(s => [s.start_location.split(',').map(Number)[1], s.start_location.split(',').map(Number)[0]]);
    }
    return { type: 'walking', summary: { distance: +rt.distance, duration: +rt.duration }, coords, steps, label: `🚶 步行 ${fmtDist(+rt.distance)} · ${fmtDur(+rt.duration)}` };
  }
  if (path.includes('driving')) {
    const rt = (data.route || {}).paths ? data.route.paths[0] : null;
    if (!rt) return null;
    const steps = (rt.steps || []).map(s => ({
      type: 'walk', // driving 用 walk 图标表示，语义上就是"移动"
      instruction: s.instruction || '驾车',
      distance: +s.distance, duration: +s.duration
    }));
    let coords = [];
    (rt.steps || []).forEach(s => { if (s.polyline) coords.push(...decodeAmapPolyline(s.polyline)); });
    return { type: 'walking', summary: { distance: +rt.distance, duration: +rt.duration }, coords, steps, label: `🚗 驾车 ${fmtDist(+rt.distance)} · ${fmtDur(+rt.duration)}` };
  }
  return null;
}

// 高德 polyline 解码
function decodeAmapPolyline(encoded) {
  if (!encoded) return [];
  const coords = [];
  let i = 0, lat = 0, lng = 0;
  while (i < encoded.length) {
    let b, shift = 0, result = 0;
    do { b = encoded.charCodeAt(i++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lat += (result & 1 ? ~(result >> 1) : (result >> 1));
    shift = 0; result = 0;
    do { b = encoded.charCodeAt(i++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lng += (result & 1 ? ~(result >> 1) : (result >> 1));
    coords.push([lat / 1e6, lng / 1e6]);
  }
  return coords;
}

// 根据坐标推算城市名（高德公交API需要city参数）
function getCity(pos) {
  if (destPos && destPos.district) return destPos.district.slice(0, 2);
  return '全国';
}

// ==================== Display ====================
function renderTabs() {
  $('sheetTitle').innerHTML = `📍 ${esc(destPos?.name || '目的地')}`;
  $('sheetMeta').textContent = `共 ${currentRoutes.length} 条方案`;
  $('routeContent').innerHTML = `
    <div class="route-tabs">${currentRoutes.map((r, i) => `<button class="route-tab${i === activeRouteIdx ? ' active' : ''}" data-idx="${i}">${esc(r.label)}</button>`).join('')}</div>
    <div id="stepContainer"></div>`;
  $('routeContent').querySelectorAll('.route-tab').forEach(t => t.addEventListener('click', () => {
    activeRouteIdx = +t.dataset.idx; renderTabs(); showRoute(activeRouteIdx);
  }));
}

function showRoute(idx) {
  const r = currentRoutes[idx]; if (!r) return;
  clearMapRoutes();
  if (r.coords && r.coords.length > 1) {
    const c = r.type === 'walking' ? '#F39C12' : '#4A90D9';
    const line = L.polyline(r.coords, { color: c, weight: 5, opacity: .7, dashArray: r.type === 'walking' ? '10 6' : null }).addTo(map);
    routeLines.push(line);
    map.fitBounds(L.latLngBounds(r.coords), { padding: [60, 60], maxZoom: 15, animate: true });
  }
  const sc = $('stepContainer'); if (!sc) return;
  const s = r.summary;
  const items = r.type === 'transit' ? [
    { val: fmtDur(s.duration), label: '预计时间' },
    { val: fmtDist(s.distance), label: '总距离' },
    { val: (s.metroCount || 0) + ' 条', label: '地铁' },
    { val: (s.busCount || 0) + ' 条', label: '公交' }
  ] : [
    { val: fmtDist(s.distance), label: '距离' },
    { val: fmtDur(s.duration), label: '时间' }
  ];
  $('sheetMeta').textContent = r.label;
  let h = `<div class="route-summary">${items.filter(m => !m.val.startsWith('0')).map(m => `<div class="route-summary-item"><div class="route-summary-val">${m.val}</div><div class="route-summary-label">${m.label}</div></div>`).join('')}</div><div class="step-list">`;
  let buf = [];
  const flush = () => {
    if (!buf.length) return;
    if (buf.length === 1) h += renderStep(buf[0]);
    else {
      const td = buf.reduce((s, st) => s + (st.distance || 0), 0);
      h += renderStep({ type: 'walk', instruction: '沿路步行', distance: td });
    }
    buf = [];
  };
  r.steps.forEach(st => { if (st.type === 'walk') buf.push(st); else { flush(); h += renderStep(st); } });
  flush();
  h += '</div>';
  if (r.type === 'walking' && currentRoutes.every(x => x.type === 'walking') && !CONFIG.amapKey) {
    h += `<div style="margin-top:20px;padding:16px;background:#FFF9E6;border-radius:var(--radius-sm);font-size:13px;color:#8B6914;line-height:1.7">💡 <b>提示：</b>当前仅显示步行路线。<br>点击右上角 ⚙️ 设置，填入高德 API Key 即可查看公交/地铁换乘方案。<br><a href="https://lbs.amap.com/" target="_blank" style="color:var(--primary)">免费获取高德 Key →</a></div>`;
  }
  sc.innerHTML = h;
}

function renderStep(s) {
  const cfg = { metro: ['metro','🚇'], bus: ['bus','🚌'], walk: ['walk','🚶'], transfer: ['transfer','🔄'] };
  const [cls, icon] = cfg[s.type] || ['walk','🚶'];
  const badge = s.line ? `<span class="step-line-badge ${cls}">${esc(s.line)}</span>` : '';
  const det = [];
  if (s.departure) det.push(`从 <b>${esc(s.departure)}</b> 上车`);
  if (s.arrival) det.push(`在 <b>${esc(s.arrival)}</b> 下车`);
  if (s.stops > 0) det.push(`途经 ${s.stops} 站`);
  if (s.distance > 0) det.push(fmtDist(s.distance));
  if (s.duration > 0) det.push(fmtDur(s.duration));
  return `<div class="step"><div class="step-icon-wrap ${cls}">${icon}</div><div class="step-content"><div class="step-title">${esc(s.instruction || '')}${badge}</div>${det.length ? `<div class="step-detail">${det.join(' · ')}</div>` : ''}</div></div>`;
}

// ==================== Map Helpers ====================
function clearMapRoutes() { routeLines.forEach(l => map.removeLayer(l)); routeLines = []; }
function clearAll() {
  clearMapRoutes(); currentRoutes = []; activeRouteIdx = 0;
  $('routeContent').innerHTML = ''; $('routeContent').style.display = 'none'; $('sheetEmpty').style.display = 'flex';
  if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
  destPos = null; $('searchInput').value = ''; $('searchClear').classList.remove('show');
  $('btnClear').style.display = 'none';
  $('sheet').classList.remove('expanded'); $('sheet').classList.add('collapsed');
  $('sheetTitle').textContent = '🗺️ 想去哪里？'; $('sheetMeta').textContent = '';
  if (myPos) map.setView([myPos.lat, myPos.lng], 15, { animate: true });
}

// ==================== Sheet Gesture ====================
let sy = 0, st = 0, dragging = false;
$('sheetHandle').addEventListener('pointerdown', e => {
  dragging = true; sy = e.clientY;
  const m = getComputedStyle($('sheet')).transform;
  st = m && m !== 'none' ? new DOMMatrixReadOnly(m).m42 : 0;
  $('sheet').style.transition = 'none';
});
document.addEventListener('pointermove', e => {
  if (!dragging) return;
  $('sheet').style.transform = `translateY(${Math.min(0, Math.max(st + e.clientY - sy, -window.innerHeight * 0.6))}px)`;
});
document.addEventListener('pointerup', () => {
  if (!dragging) return;
  dragging = false; $('sheet').style.transition = '';
  const y = new DOMMatrixReadOnly(getComputedStyle($('sheet').transform)).m42;
  if (y < -window.innerHeight * 0.15) $('sheet').classList.replace('collapsed', 'expanded');
  else $('sheet').classList.replace('expanded', 'collapsed');
});
$('sheetHeader').addEventListener('click', () => {
  if (dragging) return;
  if ($('sheet').classList.contains('expanded')) $('sheet').classList.replace('expanded', 'collapsed');
  else if (destPos) $('sheet').classList.replace('collapsed', 'expanded');
});

// ==================== Settings ====================
$('btnLocate').addEventListener('click', () => locateMe());
$('btnClear').addEventListener('click', clearAll);
$('btnSettings').addEventListener('click', () => $('settingsModal').classList.add('show'));
$('closeSettings').addEventListener('click', () => $('settingsModal').classList.remove('show'));
$('settingsModal').addEventListener('click', e => { if (e.target === $('settingsModal')) $('settingsModal').classList.remove('show'); });

$('saveSettings').addEventListener('click', () => {
  CONFIG.amapKey = $('amapKeyInput').value.trim();
  CONFIG.tileStyle = document.querySelector('#tileOptions .route-tab.active')?.dataset?.tile || 'amap';
  localStorage.setItem('transitgo_config', JSON.stringify({ amapKey: CONFIG.amapKey, tileStyle: CONFIG.tileStyle }));
  map.removeLayer(currentTile);
  currentTile = tileLayers[CONFIG.tileStyle] || tileLayers['amap'];
  currentTile.addTo(map);
  CONFIG.searchCache.clear();
  $('settingsModal').classList.remove('show');
  showToast('设置已保存 ✅');
  if (myPos && destPos) calcRoutes();
});

document.querySelectorAll('#tileOptions .route-tab').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#tileOptions .route-tab').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
}));
const atb = document.querySelector(`#tileOptions [data-tile="${CONFIG.tileStyle}"]`);
if (atb) { document.querySelectorAll('#tileOptions .route-tab').forEach(b => b.classList.remove('active')); atb.classList.add('active'); }

// ==================== Keyboard ====================
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('suggestions').classList.remove('show'); $('settingsModal').classList.remove('show'); $('searchInput').blur(); }});

// ==================== Utils ====================
function fmtDist(m) { return m < 1000 ? Math.round(m) + ' 米' : (m / 1000).toFixed(1) + ' 公里'; }
function fmtDur(s) { if (s < 60) return Math.round(s) + '秒'; if (s < 3600) return Math.round(s / 60) + '分钟'; const h = Math.floor(s / 3600); const m = Math.round((s % 3600) / 60); return h + '小时' + (m ? m + '分钟' : ''); }
function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

// ---- Init ----
locateMe(true);
window.addEventListener('resize', () => map.invalidateSize());
map.on('click', () => { $('suggestions').classList.remove('show'); $('searchInput').blur(); });
console.log('🚇 Transit Go · 高德地图版 已就绪');
console.log('📍 点击定位按钮获取当前位置');
console.log('🔍 搜索目的地自动规划路线');
console.log('⚙️ 设置高德 Key 启用公交地铁路线');
</script>
