<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#4A90D9">
<title>Transit Go · 出行导航</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#4A90D9;--primary-dark:#3A7BC8;--danger:#E74C3C;
  --bg:#FFFFFF;--bg2:#F5F7FA;--text:#1A1A2E;--text2:#666;
  --border:#E0E4E8;--radius:14px;--radius-sm:10px;--shadow:0 2px 16px rgba(0,0,0,.08);
  --metro:#E74C3C;--bus:#2ECC71;--walk:#F39C12;--transfer:#9B59B6;
  --safe-bottom:env(safe-area-inset-bottom,16px);
}
html,body{height:100%;width:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:15px;color:var(--text);background:var(--bg);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}

#map{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
.leaflet-control-zoom{display:none}
.leaflet-control-attribution{font-size:9px!important;opacity:.6;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(255,255,255,.7)!important;padding:2px 6px!important;border-radius:4px!important}

/* ===== Top Bar: Origin / Destination ===== */
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top,10px))}
.route-card{background:var(--bg);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.route-row{display:flex;align-items:center;padding:0 8px;position:relative}
.route-row:first-child{border-bottom:1px solid var(--border)}
.route-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin:0 8px}
.route-dot.from{background:#4A90D9;box-shadow:0 0 0 3px rgba(74,144,217,.2)}
.route-dot.to{background:#E74C3C;box-shadow:0 0 0 3px rgba(231,76,60,.2)}
.route-input{flex:1;border:none;outline:none;padding:13px 4px;font-size:15px;background:transparent;color:var(--text);min-width:0}
.route-input::placeholder{color:#B0B8C1}
.route-input.from{font-weight:500}
.route-clear{width:32px;height:32px;border:none;background:transparent;border-radius:50%;display:none;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:16px;flex-shrink:0}
.route-clear.show{display:flex}
.btn-swap{width:36px;height:36px;border:none;background:var(--bg2);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;flex-shrink:0;margin:0 2px;transition:transform .3s}
.btn-swap:active{transform:rotate(180deg)}
.btn-swap.flipped{transform:rotate(180deg)}
.btn-locate-inline{width:36px;height:36px;border:none;background:transparent;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;flex-shrink:0;color:var(--primary)}
.btn-locate-inline.locating{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ===== Suggestions ===== */
.suggestions{position:fixed;top:120px;left:12px;right:12px;z-index:110;background:var(--bg);border-radius:var(--radius);box-shadow:0 4px 24px rgba(0,0,0,.12);max-height:300px;overflow-y:auto;display:none}
.suggestions.show{display:block}
.sug-item{padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.sug-item:last-child{border-bottom:none}
.sug-item:active,.sug-item:hover{background:var(--bg2)}
.sug-icon{font-size:18px;flex-shrink:0;width:24px;text-align:center}
.sug-text{flex:1;min-width:0}
.sug-name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug-addr{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

/* ===== Action Buttons ===== */
.action-bar{position:fixed;top:170px;right:12px;z-index:100;display:flex;flex-direction:column;gap:8px}
.btn-action{width:44px;height:44px;border-radius:50%;border:none;background:var(--bg);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--text);transition:all .15s}
.btn-action:active{background:var(--bg2);transform:scale(.95)}
.btn-action.danger{background:var(--danger);color:#fff}

/* ===== Bottom Sheet ===== */
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.1);transform:translateY(calc(100% - 52px));height:45vh;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.4,0,.2,1),height .35s}
.sheet.expanded{transform:translateY(0);height:70vh}
.sheet.collapsed{transform:translateY(calc(100% - 52px))}
.sheet-handle{display:flex;justify-content:center;padding:12px 0 6px;cursor:pointer;flex-shrink:0}
.sheet-handle-bar{width:36px;height:4px;border-radius:2px;background:#D0D5DD}
.sheet-header{padding:0 20px 10px;flex-shrink:0;border-bottom:1px solid var(--border)}
.sheet-title{font-size:17px;font-weight:700}
.sheet-meta{font-size:13px;color:var(--text2);margin-top:2px}
.sheet-body{flex:1;overflow-y:auto;padding:12px 16px 20px;-webkit-overflow-scrolling:touch;padding-bottom:calc(20px + var(--safe-bottom))}
.sheet-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text2);text-align:center}
.sheet-empty-icon{font-size:44px;margin-bottom:10px;opacity:.6}
.sheet-empty-text{font-size:14px;line-height:1.6}

/* ===== Route Tabs ===== */
.route-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.route-tabs::-webkit-scrollbar{display:none}
.route-tab{padding:8px 14px;border-radius:18px;border:1.5px solid var(--border);background:var(--bg);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s}
.route-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ===== Journey Flow Bar ===== */
.flow-bar{display:flex;align-items:center;gap:4px;padding:10px 12px;background:var(--bg2);border-radius:var(--radius-sm);margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.flow-bar::-webkit-scrollbar{display:none}
.flow-seg{display:flex;align-items:center;gap:4px;flex-shrink:0}
.flow-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.flow-dot.start{background:var(--primary)}
.flow-dot.end{background:var(--danger)}
.flow-line{width:20px;height:2px;flex-shrink:0}
.flow-line.walk{background:var(--walk);border-radius:1px}
.flow-line.metro{background:var(--metro);border-radius:1px}
.flow-line.bus{background:var(--bus);border-radius:1px}
.flow-icon{font-size:14px;flex-shrink:0;line-height:1}
.flow-label{font-size:11px;color:var(--text2);white-space:nowrap}

/* ===== Steps ===== */
.step-list{display:flex;flex-direction:column}
.step{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.step:last-child{border-bottom:none}
.step-num{width:26px;height:26px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text2);flex-shrink:0;margin-top:2px}
.step-icon-wrap{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.step-icon-wrap.metro{background:#FDEDEC;color:var(--metro)}
.step-icon-wrap.bus{background:#E8F8F0;color:var(--bus)}
.step-icon-wrap.walk{background:#FEF5E7;color:var(--walk)}
.step-content{flex:1;min-width:0}
.step-title{font-size:14px;font-weight:600;line-height:1.4}
.step-sub{font-size:12px;color:var(--text2);margin-top:3px;line-height:1.6}
.step-stations{display:flex;align-items:center;gap:8px;margin-top:6px;padding:8px 12px;background:var(--bg2);border-radius:8px;font-size:12px}
.step-station{font-weight:600;color:var(--text)}
.step-arrow{color:var(--text2);font-size:14px}
.step-stops{color:var(--text2)}
.step-info{font-size:11px;color:var(--text2);margin-top:4px}

.route-summary{display:flex;gap:12px;padding:12px 14px;background:var(--bg2);border-radius:var(--radius-sm);margin-bottom:12px;flex-wrap:wrap}
.route-summary-item{display:flex;flex-direction:column;align-items:center;min-width:55px}
.route-summary-val{font-size:17px;font-weight:700;color:var(--primary)}
.route-summary-label{font-size:11px;color:var(--text2);margin-top:1px}

/* ===== Loading / Toast ===== */
.loading-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.3);display:none;align-items:center;justify-content:center}
.loading-overlay.show{display:flex}
.loading-spinner{background:var(--bg);border-radius:var(--radius);padding:24px 32px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.loading-spinner-icon{font-size:36px;animation:spin .8s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-spinner-text{font-size:14px;color:var(--text2)}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:300;background:#1A1A2E;color:#fff;padding:12px 22px;border-radius:24px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap}
.toast.show{opacity:1}
.toast.error{background:var(--danger)}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:80vh;overflow-y:auto;padding:8px 20px 20px;padding-bottom:calc(20px + var(--safe-bottom))}
.modal-title{font-size:18px;font-weight:700;text-align:center;padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:16px}
.modal-section{margin-bottom:20px}
.modal-label{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:8px}
.modal-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;outline:none;transition:border-color .2s}
.modal-input:focus{border-color:var(--primary)}
.modal-hint{font-size:12px;color:var(--text2);margin-top:6px;line-height:1.5}
.modal-hint a{color:var(--primary)}
.modal-btn{width:100%;padding:14px;border:none;border-radius:var(--radius-sm);font-size:16px;font-weight:600;cursor:pointer;transition:all .15s}
.modal-btn.primary{background:var(--primary);color:#fff}
.modal-btn.primary:active{background:var(--primary-dark)}
.modal-btn.secondary{background:var(--bg2);color:var(--text);margin-top:8px}

/* ===== Markers ===== */
.marker-me{width:22px;height:22px;background:var(--primary);border:3px solid #fff;border-radius:50%;box-shadow:0 2px 8px rgba(74,144,217,.4);position:relative}
.marker-me::after{content:'';position:absolute;top:50%;left:50%;width:40px;height:40px;background:rgba(74,144,217,.12);border-radius:50%;transform:translate(-50%,-50%);animation:pulse-ring 2s ease-out infinite}
@keyframes pulse-ring{0%{transform:translate(-50%,-50%) scale(.5);opacity:1}100%{transform:translate(-50%,-50%) scale(2);opacity:0}}
.marker-dest{width:32px;height:42px;position:relative}
.marker-dest::before{content:'📌';font-size:28px;position:absolute;top:0;left:50%;transform:translateX(-50%);filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
.custom-div-icon{border:none!important;background:none!important}

@media(min-width:768px){.topbar{max-width:500px;left:50%;transform:translateX(-50%);padding-left:0;padding-right:0}.suggestions{max-width:476px;left:50%;transform:translateX(-50%)}}
@media(min-width:1024px){.sheet{left:50%;transform:translate(-50%,calc(100% - 52px));max-width:500px}.sheet.expanded{transform:translate(-50%,0)}}
</style>
</head>
<body>
<div id="map"></div>

<!-- Top Bar: Origin + Destination -->
<div class="topbar">
  <div class="route-card">
    <div class="route-row">
      <div class="route-dot from"></div>
      <input type="text" class="route-input from" id="inputFrom" placeholder="🔍 搜索起点 / 自动定位" autocomplete="off" enterkeyhint="next">
      <button class="btn-locate-inline" id="btnLocateInline" title="重新定位">⊕</button>
      <button class="route-clear" id="clearFrom" title="清除">✕</button>
    </div>
    <div class="route-row">
      <div class="route-dot to"></div>
      <input type="text" class="route-input to" id="inputTo" placeholder="🔍 要去哪里？" autocomplete="off" enterkeyhint="search">
      <button class="btn-swap" id="btnSwap" title="交换起点终点">⇅</button>
      <button class="route-clear" id="clearTo" title="清除">✕</button>
    </div>
  </div>
</div>

<!-- Suggestions -->
<div class="suggestions" id="suggestions"></div>

<!-- Action Buttons -->
<div class="action-bar">
  <button class="btn-action" id="btnSettings" title="设置">⚙️</button>
  <button class="btn-action danger" id="btnClear" title="清除路线" style="display:none">✕</button>
</div>

<!-- Bottom Sheet -->
<div class="sheet collapsed" id="sheet">
  <div class="sheet-handle" id="sheetHandle"><div class="sheet-handle-bar"></div></div>
  <div class="sheet-header" id="sheetHeader">
    <div class="sheet-title" id="sheetTitle">路线方案</div>
    <div class="sheet-meta" id="sheetMeta"></div>
  </div>
  <div class="sheet-body" id="sheetBody">
    <div class="sheet-empty" id="sheetEmpty">
      <div class="sheet-empty-icon">🚇</div>
      <div class="sheet-empty-text">设置起点和终点<br>自动规划公交地铁换乘路线</div>
    </div>
    <div id="routeContent" style="display:none"></div>
  </div>
</div>

<!-- Loading / Toast / Modal -->
<div class="loading-overlay" id="loading"><div class="loading-spinner"><div class="loading-spinner-icon">⏳</div><div class="loading-spinner-text" id="loadingText">计算中...</div></div></div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <div class="modal-title">⚙️ 设置</div>
    <div class="modal-section">
      <div class="modal-label">高德地图 API Key（Web服务）</div>
      <input type="text" class="modal-input" id="amapKeyInput" placeholder="输入你的高德 Key...">
      <div class="modal-hint">
        用于地点搜索 + 公交/地铁/步行路线规划。<br>
        👉 打开 <a href="https://lbs.amap.com/" target="_blank">lbs.amap.com</a> 注册 → 创建应用 → 添加 Key。<br>
        <b>服务平台</b> 选「Web服务」。<br>
        不填可浏览地图，但搜索和公交路线需 Key。
      </div>
    </div>
    <div class="modal-section">
      <div class="modal-label">地图风格</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap" id="tileOptions">
        <button class="route-tab active" data-tile="amap">高德地图</button>
        <button class="route-tab" data-tile="osm">OSM标准</button>
        <button class="route-tab" data-tile="carto-light">浅色地图</button>
        <button class="route-tab" data-tile="carto-dark">暗色地图</button>
      </div>
    </div>
    <button class="modal-btn primary" id="saveSettings">保存设置</button>
    <button class="modal-btn secondary" id="closeSettings">取消</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ================================================================
   Transit Go · 出行导航 — 起点/终点双输入 + 详细换乘
   ================================================================ */
const $=id=>document.getElementById(id);

// ---- Config ----
const CFG={amapKey:'',tileStyle:'amap',searchTimer:null,searchCache:new Map()};
try{const s=JSON.parse(localStorage.getItem('transitgo_config')||'{}');if(s.amapKey)CFG.amapKey=s.amapKey;if(s.tileStyle)CFG.tileStyle=s.tileStyle;}catch(e){}
$('amapKeyInput').value=CFG.amapKey;

// ---- Map ----
const map=L.map('map',{zoomControl:false,attributionControl:true}).setView([39.9042,116.4074],13);
const tileLayers={
  amap:L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{maxZoom:18,subdomains:'1234',attribution:'&copy; <a href="https://www.amap.com/">高德地图</a>'}),
  osm:L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}),
  'carto-light':L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:19,attribution:'&copy; <a href="https://carto.com/">CARTO</a>'}),
  'carto-dark':L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19,attribution:'&copy; <a href="https://carto.com/">CARTO</a>'})
};
let curTile=tileLayers[CFG.tileStyle]||tileLayers.amap;curTile.addTo(map);

// ---- State ----
let fromPos=null,fromMarker=null,toPos=null,toMarker=null;
let routeLines=[],currentRoutes=[],activeIdx=0;
let activeInput=null; // 'from' | 'to' — which input is being searched

// ---- Icons ----
const fromIcon=L.divIcon({className:'custom-div-icon',html:'<div class="marker-me"></div>',iconSize:[22,22],iconAnchor:[11,11]});
const toIcon=L.divIcon({className:'custom-div-icon',html:'<div class="marker-dest"></div>',iconSize:[32,42],iconAnchor:[16,42]});

// ---- Toast / Loading ----
let ttTimer;
function toast(m,e){clearTimeout(ttTimer);$('toast').textContent=m;$('toast').className='toast show'+(e?' error':'');ttTimer=setTimeout(()=>$('toast').classList.remove('show'),2500);}
function showLd(m){$('loadingText').textContent=m||'计算中...';$('loading').classList.add('show');}
function hideLd(){$('loading').classList.remove('show');}

// ==================== Geolocation ====================
function locateMe(silent){
  if(!navigator.geolocation){if(!silent)toast('设备不支持定位',true);return;}
  if(!silent)toast('正在定位...');
  $('btnLocateInline').classList.add('locating');
  navigator.geolocation.getCurrentPosition(p=>{
    fromPos={lat:p.coords.latitude,lng:p.coords.longitude,name:'我的位置'};
    updateFromMarker();
    if(activeInput==='from'){$('inputFrom').value='📍 我的位置';}
    map.setView([fromPos.lat,fromPos.lng],15,{animate:true});
    $('btnLocateInline').classList.remove('locating');
    if(!silent)toast('定位成功 ✅');
    if(toPos)calcRoutes();
  },e=>{
    $('btnLocateInline').classList.remove('locating');
    if(!silent)toast(e.code===1?'请允许定位权限':'定位失败，请检查GPS',true);
  },{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
}

function updateFromMarker(){
  if(!fromPos)return;
  if(fromMarker)map.removeLayer(fromMarker);
  fromMarker=L.marker([fromPos.lat,fromPos.lng],{icon:fromIcon,zIndexOffset:1000}).addTo(map).bindPopup('<b>🟢 起点</b><br>'+esc(fromPos.name)).openPopup();
}
function updateToMarker(){
  if(!toPos)return;
  if(toMarker)map.removeLayer(toMarker);
  toMarker=L.marker([toPos.lat,toPos.lng],{icon:toIcon,zIndexOffset:999}).addTo(map).bindPopup('<b>🔴 终点</b><br>'+esc(toPos.name)).openPopup();
}

// ==================== Search ====================
function buildSearchUrl(q){
  if(CFG.amapKey)return `https://restapi.amap.com/v3/assistant/inputtips?key=${CFG.amapKey}&keywords=${encodeURIComponent(q)}&output=json`;
  return `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=5&accept-language=zh&countrycodes=cn`;
}

// Input: From
$('inputFrom').addEventListener('focus',()=>{activeInput='from';$('inputFrom').select();});
$('inputFrom').addEventListener('input',()=>handleInput('from'));
$('inputFrom').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchCurrent();}});

// Input: To
$('inputTo').addEventListener('focus',()=>{activeInput='to';});
$('inputTo').addEventListener('input',()=>handleInput('to'));
$('inputTo').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchCurrent();}});

function getActiveInput(){return activeInput==='from'?$('inputFrom'):$('inputTo');}
function getActivePos(){return activeInput==='from'?fromPos:toPos;}

function handleInput(which){
  const inp=which==='from'?$('inputFrom'):$('inputTo');
  const clr=which==='from'?$('clearFrom'):$('clearTo');
  const q=inp.value.trim();
  clr.classList.toggle('show',q.length>0);
  clearTimeout(CFG.searchTimer);
  if(q.length<1){$('suggestions').classList.remove('show');return;}
  if(CFG.searchCache.has(q)){renderSuggestions(CFG.searchCache.get(q));return;}
  CFG.searchTimer=setTimeout(()=>{
    fetch(buildSearchUrl(q)).then(r=>r.json()).then(d=>{CFG.searchCache.set(q,d);if(inp.value.trim()===q)renderSuggestions(d);}).catch(()=>{});
  },350);
}

function searchCurrent(){
  const inp=getActiveInput();
  const q=inp.value.trim();
  if(!q)return;
  $('suggestions').classList.remove('show');
  inp.blur();
  showLd('搜索中...');
  fetch(buildSearchUrl(q)).then(r=>r.json()).then(d=>{
    hideLd();
    if(!d){toast('未找到',true);return;}
    let lat,lng,name,district;
    if(d.tips){
      const t=d.tips.filter(t=>t.location&&t.location!=='0,0')[0];
      if(!t){toast('未找到',true);return;}
      [lng,lat]=t.location.split(',').map(Number);name=t.name;district=t.district||'';
    }else{
      if(!d.length){toast('未找到',true);return;}
      lat=+d[0].lat;lng=+d[0].lon;name=d[0].display_name.split(',')[0];district='';
    }
    setPosition(name,lat,lng,district);
  }).catch(()=>{hideLd();toast('搜索失败',true);});
}

function renderSuggestions(data){
  const s=$('suggestions');
  const empty=!data||(Array.isArray(data)&&!data.length)||(data.tips&&!data.tips.filter(t=>t.location&&t.location!=='0,0').length);
  if(empty){s.innerHTML='<div class="sug-item" style="color:var(--text2);justify-content:center">未找到结果</div>';s.classList.add('show');return;}
  if(data.tips){
    s.innerHTML=data.tips.filter(t=>t.location&&t.location!=='0,0').map((t,i)=>`<div class="sug-item" data-idx="${i}"><span class="sug-icon">${t.tipType===5?'🚉':t.tipType===4?'🚌':'📍'}</span><div class="sug-text"><div class="sug-name">${esc(t.name)}</div><div class="sug-addr">${esc(t.district||'')}${esc(t.address||'')}</div></div></div>`).join('');
  }else{
    s.innerHTML=data.map((t,i)=>`<div class="sug-item" data-idx="${i}"><span class="sug-icon">📍</span><div class="sug-text"><div class="sug-name">${esc(t.display_name.split(',')[0])}</div><div class="sug-addr">${esc(t.display_name.split(',').slice(1).join(',').trim())}</div></div></div>`).join('');
  }
  s.classList.add('show');
}

$('suggestions').addEventListener('click',e=>{
  const it=e.target.closest('.sug-item');if(!it)return;
  const idx=+it.dataset.idx;
  const inp=getActiveInput();
  const data=CFG.searchCache.get(inp.value.trim());
  if(!data)return;
  $('suggestions').classList.remove('show');
  let lat,lng,name,district;
  if(data.tips){const t=data.tips.filter(t=>t.location&&t.location!=='0,0')[idx];[lng,lat]=t.location.split(',').map(Number);name=t.name;district=t.district||'';}
  else{lat=+data[idx].lat;lng=+data[idx].lon;name=data[idx].display_name.split(',')[0];district='';}
  setPosition(name,lat,lng,district);
});

function setPosition(name,lat,lng,district){
  const inp=getActiveInput();
  inp.value=name;
  (activeInput==='from'?$('clearFrom'):$('clearTo')).classList.add('show');
  if(activeInput==='from'){
    fromPos={lat,lng,name,district:district||''};
    updateFromMarker();
  }else{
    toPos={lat,lng,name,district:district||''};
    updateToMarker();
  }
  fitBoth();
  $('btnClear').style.display='flex';
  if(fromPos&&toPos)calcRoutes();
}

// Set from GPS
$('btnLocateInline').addEventListener('click',()=>{
  activeInput='from';
  locateMe(false);
});

// Swap origin/destination
$('btnSwap').addEventListener('click',()=>{
  const tmpP=fromPos,tmpN=$('inputFrom').value;
  fromPos=toPos;toPos=tmpP;
  $('inputFrom').value=toPos?toPos.name:'';
  $('inputTo').value=fromPos?fromPos.name:'';
  $('clearFrom').classList.toggle('show',!!fromPos);
  $('clearTo').classList.toggle('show',!!toPos);
  if(fromMarker)map.removeLayer(fromMarker);fromMarker=null;
  if(toMarker)map.removeLayer(toMarker);toMarker=null;
  updateFromMarker();updateToMarker();
  fitBoth();
  if(fromPos&&toPos)calcRoutes();
  $('btnSwap').classList.toggle('flipped');
});

// Clear buttons
$('clearFrom').addEventListener('click',()=>{$('inputFrom').value='';$('clearFrom').classList.remove('show');fromPos=null;if(fromMarker){map.removeLayer(fromMarker);fromMarker=null;}});
$('clearTo').addEventListener('click',()=>{$('inputTo').value='';$('clearTo').classList.remove('show');toPos=null;if(toMarker){map.removeLayer(toMarker);toMarker=null;}});

function fitBoth(){
  if(!fromPos&&!toPos)return;
  if(fromPos&&toPos){map.fitBounds(L.latLngBounds([fromPos.lat,fromPos.lng],[toPos.lat,toPos.lng]),{padding:[60,60],maxZoom:15,animate:true});}
  else{const p=fromPos||toPos;map.setView([p.lat,p.lng],15,{animate:true});}
}

// ==================== Routes ====================
async function calcRoutes(){
  if(!fromPos||!toPos)return;
  clearMapRoutes();
  showLd('计算路线中...');
  $('sheetEmpty').style.display='none';
  $('routeContent').style.display='block';
  $('routeContent').innerHTML='';
  currentRoutes=[];

  if(CFG.amapKey){
    const or=`${fromPos.lng},${fromPos.lat}`,de=`${toPos.lng},${toPos.lat}`;
    const[tr,wk,dr]=await Promise.allSettled([
      fetchAmap('direction/transit/integrated',{origin:or,destination:de,city:fromPos.district||'全国',cityd:toPos.district||'全国'}),
      fetchAmap('direction/walking',{origin:or,destination:de}),
      fetchAmap('direction/driving',{origin:or,destination:de})
    ]);
    if(tr.status==='fulfilled'&&tr.value)currentRoutes.push(...tr.value);
    if(wk.status==='fulfilled'&&wk.value)currentRoutes.push(wk.value);
    if(dr.status==='fulfilled'&&dr.value)currentRoutes.push(dr.value);
  }else{
    try{
      const r=await fetch(`https://router.project-osrm.org/route/v1/foot/${fromPos.lng},${fromPos.lat};${toPos.lng},${toPos.lat}?overview=full&steps=true&alternatives=true&geometries=geojson`);
      const d=await r.json();
      if(d.code==='Ok')for(let i=0;i<Math.min(d.routes.length,2);i++){
        const rt=d.routes[i],steps=[];
        rt.legs.forEach(l=>l.steps.forEach(s=>steps.push({type:'walk',instruction:s.maneuver.type==='depart'?'从起点出发':s.maneuver.type==='arrive'?'到达目的地':'步行',distance:Math.round(s.distance),duration:Math.round(s.duration)})));
        currentRoutes.push({type:'walking',summary:{distance:Math.round(rt.distance),duration:Math.round(rt.duration)},coords:rt.geometry.coordinates.map(c=>[c[1],c[0]]),steps,label:`🚶 步行 ${fmtDist(rt.distance)} · ${fmtDur(rt.duration)}`});
      }
    }catch(e){}
  }

  hideLd();
  if(!currentRoutes.length){$('routeContent').innerHTML='<div class="sheet-empty" style="height:auto;padding:30px"><div class="sheet-empty-icon">😔</div><div class="sheet-empty-text">未找到路线，请检查起点终点或网络</div></div>';return;}
  activeIdx=0;renderTabs();showRoute(0);
  $('sheet').classList.replace('collapsed','expanded');
}

async function fetchAmap(path,params){
  params.key=CFG.amapKey;params.output='json';
  const r=await fetch(`https://restapi.amap.com/v3/${path}?${new URLSearchParams(params)}`);
  const d=await r.json();
  if(d.status!=='1'||d.errcode)return null;
  return parseAmap(d,path);
}

function parseAmap(data,path){
  if(path.includes('transit')){
    return (data.route?.transits||[]).map(t=>{
      const steps=[];let mn=0,bn=0;let allCoords=[];
      t.segments.forEach(seg=>{
        if(seg.walking){const w=seg.walking;steps.push({type:'walk',instruction:'步行',distance:+w.distance,duration:+w.duration});if(w.steps)w.steps.forEach(s=>{if(s.polyline)allCoords.push(...decodePoly(s.polyline));});}
        if(seg.bus&&seg.bus.buslines)seg.bus.buslines.forEach(bl=>{
          const tp=(bl.type||'').includes('地铁')?'metro':'bus';if(tp==='metro')mn++;else bn++;
          steps.push({type:tp,line:bl.name,departure:(bl.departure_stop||{}).name||'',arrival:(bl.arrival_stop||{}).name||'',stops:+(bl.via_num||0),distance:+bl.distance,duration:+bl.duration});
          if(bl.polyline)allCoords.push(...decodePoly(bl.polyline));
        });
      });
      const parts=[];if(mn)parts.push(`🚇${mn}次`);if(bn)parts.push(`🚌${bn}次`);
      return{type:'transit',summary:{distance:+t.distance,duration:+t.duration,metroCount:mn,busCount:bn},coords:allCoords,steps,label:`${parts.join('·')} · ${fmtDur(+t.duration)}`};
    });
  }
  if(path.includes('walking')||path.includes('driving')){
    const rt=data.route?.paths?.[0];if(!rt)return null;
    const steps=(rt.steps||[]).map(s=>({type:'walk',instruction:s.instruction||'步行',distance:+s.distance,duration:+s.duration}));
    let coords=[];(rt.steps||[]).forEach(s=>{if(s.polyline)coords.push(...decodePoly(s.polyline));});
    const ico=path.includes('driving')?'🚗':'🚶',lbl=path.includes('driving')?'驾车':'步行';
    return{type:'walking',summary:{distance:+rt.distance,duration:+rt.duration},coords,steps,label:`${ico} ${lbl} ${fmtDist(+rt.distance)} · ${fmtDur(+rt.duration)}`};
  }
  return null;
}

function decodePoly(e){if(!e)return[];const c=[];let i=0,la=0,ln=0;while(i<e.length){let b,sh=0,r=0;do{b=e.charCodeAt(i++)-63;r|=(b&0x1f)<<sh;sh+=5}while(b>=0x20);la+=(r&1?~(r>>1):(r>>1));sh=0;r=0;do{b=e.charCodeAt(i++)-63;r|=(b&0x1f)<<sh;sh+=5}while(b>=0x20);ln+=(r&1?~(r>>1):(r>>1));c.push([la/1e6,ln/1e6]);}return c;}

// ==================== Display ====================
function renderTabs(){
  $('sheetTitle').textContent=`${esc(fromPos?.name||'起点')} → ${esc(toPos?.name||'终点')}`;
  $('sheetMeta').textContent=`${currentRoutes.length} 条方案`;
  $('routeContent').innerHTML=`
    <div class="route-tabs">${currentRoutes.map((r,i)=>`<button class="route-tab${i===activeIdx?' active':''}" data-idx="${i}">${esc(r.label)}</button>`).join('')}</div>
    <div id="stepContainer"></div>`;
  $('routeContent').querySelectorAll('.route-tab').forEach(t=>t.addEventListener('click',()=>{activeIdx=+t.dataset.idx;renderTabs();showRoute(activeIdx);}));
}

function showRoute(idx){
  const r=currentRoutes[idx];if(!r)return;
  clearMapRoutes();
  if(r.coords&&r.coords.length>1){const cl=r.type==='walking'?'#F39C12':'#4A90D9';const ln=L.polyline(r.coords,{color:cl,weight:5,opacity:.7,dashArray:r.type==='walking'?'10 6':null}).addTo(map);routeLines.push(ln);map.fitBounds(L.latLngBounds(r.coords),{padding:[60,60],maxZoom:15,animate:true});}
  const sc=$('stepContainer');if(!sc)return;
  $('sheetMeta').textContent=r.label;
  const s=r.summary;
  let sumItems=[{val:fmtDur(s.duration),label:'预计时间'},{val:fmtDist(s.distance),label:'总距离'}];
  if(r.type==='transit'){if(s.metroCount)sumItems.push({val:s.metroCount+' 条',label:'地铁'});if(s.busCount)sumItems.push({val:s.busCount+' 条',label:'公交'});}

  // Build flow bar for transit routes
  let flowHtml='';
  if(r.type==='transit'){
    const segs=[];r.steps.forEach(st=>{segs.push(st.type);});
    flowHtml='<div class="flow-bar"><div class="flow-seg"><div class="flow-dot start"></div><span class="flow-label">起</span></div>';
    segs.forEach(tp=>{const cl=tp==='metro'?'metro':tp==='bus'?'bus':'walk';const ic=tp==='metro'?'🚇':tp==='bus'?'🚌':'🚶';flowHtml+=`<div class="flow-line ${cl}" style="width:24px"></div><div class="flow-icon">${ic}</div><div class="flow-line ${cl}" style="width:24px"></div>`;});
    flowHtml+='<div class="flow-seg"><div class="flow-dot end"></div><span class="flow-label">终</span></div></div>';
  }

  let h=`<div class="route-summary">${sumItems.map(m=>`<div class="route-summary-item"><div class="route-summary-val">${m.val}</div><div class="route-summary-label">${m.label}</div></div>`).join('')}</div>${flowHtml}<div class="step-list">`;

  let stepNum=0,buf=[];
  const flush=()=>{if(!buf.length)return;if(buf.length===1)h+=renderStep(++stepNum,buf[0]);else{const td=buf.reduce((s,st)=>s+(st.distance||0),0);h+=renderStep(++stepNum,{type:'walk',instruction:'沿路步行',distance:td});}buf=[];};
  r.steps.forEach(st=>{if(st.type==='walk')buf.push(st);else{flush();h+=renderStep(++stepNum,st);}});
  flush();
  h+='</div>';
  if(!CFG.amapKey&&currentRoutes.every(x=>x.type==='walking')){h+=`<div style="margin-top:20px;padding:16px;background:#FFF9E6;border-radius:10px;font-size:13px;color:#8B6914;line-height:1.7">💡 <b>提示：</b>当前仅显示步行/驾车路线。<br>点击右上角 ⚙️ 设置，填入高德 Key 即可查看公交地铁换乘方案。<br><a href="https://lbs.amap.com/" target="_blank" style="color:var(--primary)">免费获取 Key →</a></div>`;}
  sc.innerHTML=h;
}

function renderStep(num,s){
  const cfg={metro:['metro','🚇','乘坐地铁'],bus:['bus','🚌','乘坐公交'],walk:['walk','🚶','步行'],transfer:['transfer','🔄','换乘']};
  const[cls,icon]=cfg[s.type]||['walk','🚶'];
  let title=s.instruction||cfg[s.type]?.[2]||'';
  let sub='';

  if(s.type==='metro'||s.type==='bus'){
    title=`乘坐 ${esc(s.line||'')}`;
    let stations='';
    if(s.departure&&s.arrival){
      stations=`<div class="step-stations"><span class="step-station">${esc(s.departure)}</span><span class="step-arrow">→</span><span class="step-station">${esc(s.arrival)}</span><span class="step-stops">${s.stops>0?s.stops+'站':''}</span></div>`;
    }
    sub=`${stations}<div class="step-info">${fmtDist(s.distance)} · ${fmtDur(s.duration)}</div>`;
  }else if(s.type==='walk'){
    title=s.instruction||'步行';
    sub=`<div class="step-info">${s.distance?fmtDist(s.distance):''} ${s.duration?fmtDur(s.duration):''}</div>`;
  }

  return`<div class="step"><div class="step-num">${num}</div><div class="step-icon-wrap ${cls}">${icon}</div><div class="step-content"><div class="step-title">${esc(title)}</div>${sub}</div></div>`;
}

// ==================== Map Helpers ====================
function clearMapRoutes(){routeLines.forEach(l=>map.removeLayer(l));routeLines=[];}
function clearAll(){
  clearMapRoutes();currentRoutes=[];activeIdx=0;
  $('routeContent').innerHTML='';$('routeContent').style.display='none';$('sheetEmpty').style.display='flex';
  $('btnClear').style.display='none';
  $('sheet').classList.replace('expanded','collapsed');
  $('sheetTitle').textContent='路线方案';$('sheetMeta').textContent='';
}

// ==================== Sheet Gesture ====================
let sy=0,st=0,dragging=false;
$('sheetHandle').addEventListener('pointerdown',e=>{
  dragging=true;sy=e.clientY;const m=getComputedStyle($('sheet')).transform;st=m&&m!=='none'?new DOMMatrixReadOnly(m).m42:0;$('sheet').style.transition='none';
});
document.addEventListener('pointermove',e=>{if(!dragging)return;$('sheet').style.transform=`translateY(${Math.min(0,Math.max(st+e.clientY-sy,-window.innerHeight*.6))}px)`;});
document.addEventListener('pointerup',()=>{
  if(!dragging)return;dragging=false;$('sheet').style.transition='';const y=new DOMMatrixReadOnly(getComputedStyle($('sheet').transform)).m42;
  if(y<-window.innerHeight*.15)$('sheet').classList.replace('collapsed','expanded');else $('sheet').classList.replace('expanded','collapsed');
});

// ==================== Settings ====================
$('btnSettings').addEventListener('click',()=>$('settingsModal').classList.add('show'));
$('closeSettings').addEventListener('click',()=>$('settingsModal').classList.remove('show'));
$('settingsModal').addEventListener('click',e=>{if(e.target===$('settingsModal'))$('settingsModal').classList.remove('show');});
$('saveSettings').addEventListener('click',()=>{
  CFG.amapKey=$('amapKeyInput').value.trim();
  CFG.tileStyle=document.querySelector('#tileOptions .route-tab.active')?.dataset?.tile||'amap';
  localStorage.setItem('transitgo_config',JSON.stringify({amapKey:CFG.amapKey,tileStyle:CFG.tileStyle}));
  map.removeLayer(curTile);curTile=tileLayers[CFG.tileStyle]||tileLayers.amap;curTile.addTo(map);
  CFG.searchCache.clear();
  $('settingsModal').classList.remove('show');toast('设置已保存 ✅');
  if(fromPos&&toPos)calcRoutes();
});
document.querySelectorAll('#tileOptions .route-tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#tileOptions .route-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');}));
const atb=document.querySelector(`#tileOptions [data-tile="${CFG.tileStyle}"]`);if(atb){document.querySelectorAll('#tileOptions .route-tab').forEach(b=>b.classList.remove('active'));atb.classList.add('active');}

// ==================== Escape / Map Click ====================
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('suggestions').classList.remove('show');$('settingsModal').classList.remove('show');$('inputFrom').blur();$('inputTo').blur();}});
map.on('click',()=>{$('suggestions').classList.remove('show');$('inputFrom').blur();$('inputTo').blur();});

// ==================== Utils ====================
function fmtDist(m){return m<1000?Math.round(m)+'米':(m/1000).toFixed(1)+'公里';}
function fmtDur(s){if(s<60)return Math.round(s)+'秒';if(s<3600)return Math.round(s/60)+'分钟';const h=Math.floor(s/3600),m=Math.round((s%3600)/60);return h+'小时'+(m?m+'分钟':'');}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

// ==================== Init ====================
locateMe(true);
window.addEventListener('resize',()=>map.invalidateSize());
console.log('🚇 Transit Go 已就绪');
</script>
